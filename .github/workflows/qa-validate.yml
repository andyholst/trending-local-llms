name: qa-validate

# PR CI — VALIDATION + AUTO-MERGE. Never refreshes data, never commits.
#
#   guard           action-pin-check (below): every third-party `uses:` ref and
#                   tool-image tag in this repo is pinned to an immutable 40-hex
#                   SHA; a mutable ref fails the gate. To bump an action, see
#                   "Bumping a pinned GitHub Action" in README.md.
#
#   validate        deterministic: data store, README, contracts, mapping, unit
#                   tests (incl. Makefile recipe, workflow wiring and fix-loop
#                   control-flow tests). A red validate dispatches nothing (issue
#                   #814): it stays red for the §6r sweep or a human.
#   live-smoke      REAL network, bounded: the exact Firecrawl->lightbrd scrape
#                   for every nvidia / metal / cpu / amd search query (3s cap each),
#                   one real Hermes call through the search alias, and a real
#                   --require-hits search. Catches a dead key, a broken alias, a
#                   provider mis-route or an unreachable mirror on the PR,
#                   instead of 20 minutes into the next refresh. An outage here
#                   is infra, not data.
#   auto-merge      when `validate` AND `live-smoke` are GREEN on a same-repo,
#                   non-draft PR: squash-merge exactly the validated head commit
#                   and delete the feature branch (owner PAT). Red -> stays open.
#
# Workflow-only PRs (.github/**) are validated too: the workflow wiring is
# itself under test (tests/test_workflows.py).
#
# Local equivalent:
#   make docker-build docker-test-build && make validate validate-search validate-mapped test
#   NOUS_API_KEY=... FIRECRAWL_API_KEY=... make pipeline-smoke validate-fetch

on:
  pull_request:
    paths:
      - "**"
      - "!LICENSE"
  push:
    branches: [master]
    paths:
      - "**"
      - "!LICENSE"
  workflow_dispatch:

permissions:
  contents: read

env:
  NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  # The nerve plugin's Jev provider credential (issue #120). Only the NAME the
  # plugin resolves is wired (`-e TYPESAFE_API_KEY` in the Makefile run
  # wrappers, AGENTS.md rule 3e) — an unset secret simply leaves the plugin
  # reporting its key missing, loudly, never a different provider.
  TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

jobs:
  # Before anything reads a secret: owner, a write+ collaborator, or the bot
  # itself (rule 6j, issue #238). qa-validate is the ONLY pipeline that also runs
  # on the repository's OWN events, so its guard admits those outright — GitHub
  # starts a `pull_request`/`push` run for the repository itself (there is no
  # caller to admit), and a PR must be validated whatever its author. The
  # 30-minute, network-bound DISPATCH is what this guards (issue #279).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Owner / collaborator trigger guard
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT" in
            pull_request|push)
              echo "$EVENT is a repository event, not a dispatch - allowed."
              exit 0 ;;
          esac
          # Owner, the bot itself (github-actions[bot], a bot-to-bot dispatch), or
          # a collaborator with write/maintain/admin, for BOTH the actor and the
          # triggering actor (covers re-runs). Anything else - including an API
          # error - is refused.
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            if [ "$u" = "github-actions[bot]" ]; then echo "The bot itself ($u) - allowed."; continue; fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner, the bot, or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  validate:
    needs: guard
    runs-on: ubuntu-latest
    # `contents: read` is the workflow default; the lifecycle guard (rule 6f,
    # issue #183) also reads PR STATE, which needs pull-requests read and a token
    # in the environment. Nothing here writes.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    # 20 -> 30: when the revision's Dockerfile is not published yet this job
    # builds the base from source before the suite (issue #135).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The PR's OWN tree, never the merge result (issue #432). `pull_request`
          # otherwise checks out the MERGE COMMIT, so `make openspec-check` compared the
          # index with a tree that carries every other open change and reported
          # "[openspec-index] FAIL … (84 active on disk)" on a branch whose index was
          # current when it was written — three times in one session, and a PR could never
          # be green while a sibling merged first. The index is a generated file that every
          # change edits; it can only be verified against the tree that produced it.
          # `master`'s own index is verified by this pipeline's `push` run, and `auto-merge`
          # matches on the validated head SHA, so what merges is what was checked.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # FULL history: `make check-commit-authorship` reads the commits a PR
          # adds (`origin/master..HEAD`), and a shallow checkout has no base ref
          # — the guard would then fail loudly instead of checking anything
          # (issue #317).
          fetch-depth: 0

      # Cheapest gate first, and it needs no image: every tracked text file ends
      # with a newline (issue #186). A file stripped of its final newline turns
      # the next append into a spurious last-line change — git says
      # `\ No newline at end of file` — so the diff stops being honest.
      - name: Lint (every tracked text file ends with a newline)
        run: make lint

      # The only identities on this repo are Andy Holst and Asimov Agent. Nothing
      # read a commit's MESSAGE or a commit's IDENTITY, so a
      # `Co-authored-by: Hermes Agent <hermes@nousresearch.com>` trailer landed on
      # master. The trailer is SYNTHESIZED by GitHub at squash time from the AUTHOR
      # identity of a commit inside the PR (measured: 054b0c8), so the guard reads
      # the identity AND the message (issue #317). Git-only, no
      # image, so it sits with the other cheap gates.
      - name: No commit credits anyone but Andy Holst / Asimov Agent (issue #317)
        run: make check-commit-authorship

      # A merged PR must CLOSE the issue it implements (rule 6e). The body is the only
      # artifact with no guard on its content, and GitHub binds a closing keyword to ONE
      # reference: `Closes #1 and #2` closes #1 and leaves #2 open after the merge
      # (measured: PR #272 left issue #276 open). The check reads the webhook payload by
      # PATH ($GITHUB_EVENT_PATH) — nothing is interpolated into this run block, and it
      # needs no image, so it sits with the other cheap gates.
      - name: The PR closes the issue its branch implements (rule 6e)
        run: make pr-closure

      # The base image carries the pinned plugins (Dockerfile). Pull the PUBLISHED
      # base only when it was built from THIS revision's Dockerfile — the
      # published tag names the Dockerfile hash. Otherwise build from source, so a
      # Dockerfile change is exercised by its own CI run instead of silently
      # validating the previous base (issue #135: the guard's plugin-presence
      # assertion used to degrade to a note on a stale base).
      # ONE path for both images: pull each one when the tag naming this
      # revision's inputs is published, else build it here (issues #135/#141).
      - name: Prepare runner images (published for this revision, else build)
        run: make image-ensure

      # FIRST: no credential may reach the repo. A finding here turns the PR red
      # (the same any-round gate) — remove the value and rotate the key,
      # never allowlist a real value (AGENTS.md rule 3d).
      - name: Secret scan (working tree) — gitleaks
        run: make secret-scan

      # …and prove the scanner itself works (a planted fake credential MUST be
      # caught): a scanner that silently does nothing is a false green.
      - name: Secret scan self-test (the planted credential is detected)
        run: make secret-scan-self-test

      # gitleaks only catches a committed credential VALUE. This guard catches
      # the run-time leak shapes — a printed value, a `-e KEY=$KEY`, a
      # `${{ secrets.X }}` in a `run:` block, an xtrace, an env dump, a committed
      # credential-shaped literal (issue #219).
      - name: No secret VALUE reaches a log/argv/env (check_secret_output)
        run: make check-secret-output

      # Immutable-SHA pin guard (issue #735, #714 Slice 1, folding #717): every
      # third-party workflow `uses:` ref must be a 40-hex SHA or on the allow-ref
      # list, and every third-party tool image must be pinned (digest or fleet
      # `<sha12>` tag) or allowlisted. Fails closed — a NEW mutable third-party
      # ref refuses the PR. Current refs are allowlisted with allow-till
      # deadlines (#714/#715 migration slices will pin them).
      - name: No mutable third-party workflow/tool-image ref (action-pin-check)
        run: make action-pin-check

      # The nerve credential reaches the container only as `-e` under the NAME
      # the plugin actually resolves — pinned plugin, no literal, and a loud
      # failure when the key is absent (issue #120, AGENTS.md rule 3e).
      - name: Nerve plugin credential guard (name only, never baked)
        run: make nerve-check

      - name: Validate data store + README + contracts (deterministic, in container)
        run: |
          make validate
          make validate-search
          make validate-mapped

      # Every change is a TRACKED change: its capability spec validates, its task
      # checklist is fully ticked and OPENSPEC.md (the root index of every change)
      # is current. `make openspec-check` also ensures the CLI image — pulled by
      # this revision's openspec/Dockerfile hash, built here when unpublished.
      - name: OpenSpec gate (changes validate, tasks ticked, index current)
        run: make openspec-check

      # The lifecycle's END (rule 6f, issue #183): a change whose PR is merged must
      # be archived in the PR that completes it, so an ACTIVE change naming a
      # merged PR is a defect. PR state is a GitHub fact, read on the HOST with the
      # workflow token — `gh` is absent from the agent container, which is why this
      # is its own step rather than part of `make openspec-check`.
      - name: OpenSpec lifecycle (no active change names a merged PR; a closing PR must not strand its change)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: make openspec-archive-check PR="${PR_NUMBER:-}"

      # The reintroduction gate (issue #802): `data/pipeline_failures.json` records every
      # main-pipeline failure the filer diagnosed. A ledger entry whose fix landed must name a
      # guard test under tests/ that `make test` collects; an issue CLOSED with no fix PR and no
      # guard is RED — a closed pipeline failure without a guard is reintroducible, and this is
      # the pipeline that refuses it. Open entries are reported, never red.
      - name: Pipeline-failure ledger (every closed failure carries its guard; issue #802)
        env:
          GH_TOKEN: ${{ github.token }}
        run: make pipeline-failure-guard-check

      # The description is part of the change (rule 6h): every public make
      # target, workflow and script must be in ARCHITECTURE.md, and nothing it
      # names may be gone from the repository.
      - name: Architecture description (rule 6h)
        run: make architecture-check

      - name: Run unit tests (in container)
        run: make test

  live-smoke:
    needs: guard
    runs-on: ubuntu-latest
    # Same build-from-source path as `validate` when the Dockerfile is fresh.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare runner images (published for this revision, else build)
        run: make image-ensure

      - name: Search reachability — nvidia (HTTP 200 within 3s per query)
        run: make search-smoke BACKEND=nvidia
      - name: Search reachability — metal (HTTP 200 within 3s per query)
        run: make search-smoke BACKEND=metal
      - name: Search reachability — cpu (HTTP 200 within 3s per query)
        run: make search-smoke BACKEND=cpu
      - name: Search reachability — amd (HTTP 200 within 3s per query)
        run: make search-smoke BACKEND=amd

      - name: Model caps (model served, max_tokens fits, accepts reasoning)
        run: make model-caps

      - name: Hermes routing smoke (real call through the search alias)
        run: make hermes-smoke

      # Hermes STRIPS provider credentials from the agent's terminal, so a key
      # that reaches the container can still be EMPTY in the agent's `curl`
      # (every refresh search leg: HTTP 401 with `FIRECRAWL_API_KEY: ***` set).
      # Real secrets, the bot image, Hermes's own terminal env (issue #359).
      - name: Agent shell sees every credential (_HERMES_FORCE_<NAME>)
        run: make agent-shell-keys-check

      - name: Search returns data (real Firecrawl->lightbrd, --require-hits)
        run: make validate-fetch

  auto-merge:
    needs: [validate, live-smoke]
    if: >-
      success() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'master' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # The job calls `make` (the closure proof below), and `make` needs the Makefile: a
      # `make` call in a job that never checked the repository out dies with
      # `No targets specified and no makefile found` (the measured class of issue #281).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # do-not-merge label hold (#722): GitHub-native auto-merge fires the instant
      # validate+live-smoke go green, which has twice merged an advisory-held PR
      # (#713, #719). Before the squash-merge step read the PR labels; if the
      # `do-not-merge` label is present, hold: echo the hold and exit without calling
      # `gh pr merge` so the PR stays OPEN and the run stays green/honest (a hold,
      # not a failure). The squash-merge step below also mirrors this in its `if:`
      # so a label that appears mid-run still pries the merge step off.
      - name: Hold if PR carries the do-not-merge label (#722)
        id: dnm-check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          LABELS=$(gh api "repos/$REPO/issues/$PR_NUM/labels" --jq '[.[] | .name] | join(",")')
          echo "PR #$PR_NUM labels: ${LABELS:-<none>}"
          if echo "${LABELS}" | tr ',' '\n' | grep -qx 'do-not-merge'; then
            echo "do-not-merge label present on PR #$PR_NUM — holding; will NOT auto-merge."
            echo "hold=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR #$PR_NUM not labeled do-not-merge — auto-merge allowed."
            echo "hold=false" >> "$GITHUB_OUTPUT"
          fi

      # Squash-merge ONLY the exact commit that was validated (--match-head-commit):
      # a push after this run started leaves the PR open for the newer run.
      # Owner PAT, not GITHUB_TOKEN: a merge made with GITHUB_TOKEN starts no
      # workflows, so the post-merge qa-validate on master would never run.
      - name: Squash-merge the green PR + delete its branch (owner PAT)
        if: steps.dnm-check.outputs.hold != 'true'
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          STATE=$(gh pr view "$PR_NUM" --repo "$REPO" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR_NUM is $STATE — nothing to merge."
            exit 0
          fi
          # A bare `--squash` composes the squash commit from the PR TITLE ONLY:
          # no sections, no bound `Closes`, and master's own push gate
          # `make commit-message-check` (pr-closure.yml) REFUSES that message, so
          # every bot merge left master red (measured: run 43050329961 landed
          # squash d3d4116 as the title line alone, #779's closing lost in
          # transit). The landed commit must carry the merged PR's OWN title and
          # body: read them back from the PR and pass them explicitly. The body
          # goes through a file, never a shell interpolation — it is arbitrary
          # markdown, possibly with backticks and `$` (issue #787).
          gh pr view "$PR_NUM" --repo "$REPO" --json title --jq .title > squash-subject.txt
          gh pr view "$PR_NUM" --repo "$REPO" --json body --jq '.body // ""' > squash-body.txt
          test -s squash-subject.txt || { echo "PR #$PR_NUM has no title to merge"; exit 1; }
          gh pr merge "$PR_NUM" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA" \
            --subject "$(cat squash-subject.txt)" --body-file squash-body.txt
          # Then PROVE what the merge closed (issue #288): `make pr-closure` predicts it, this
          # reads the merged PR's own closing references a moment later. A body whose keyword
          # did not bind (the measured `Closes #271 and #276`) leaves a red run instead of a
          # green one over an issue that is still open.
          make verify-closure PR="$PR_NUM" REPO="$REPO"
          echo "Merged PR #$PR_NUM at $HEAD_SHA (validate + live-smoke green)"

  # The event-driven keeper for a red OpenSpec index gate (issue #304, rule 6q).
  # A merged PR archives its OpenSpec change, so master's tree no longer matches
  # the committed, generated OPENSPEC.md and the push-to-master `validate` goes
  # red — and a red master validate has no PR-side repairer: auto-merge of EVERY
  # open PR waits behind it (measured 2026-11-12: pushes 28f2cd3 and ce57e9b,
  # both red at the OpenSpec gate; auto-merge blocked repo-wide for hours).
  # This job runs only after a FAILED validate on a push to master, against the
  # exact post-merge tree that just went red. `make openspec-index-repair`
  # classifies the drift (rule 6d: the verdict DRIFT=none|index-only comes from
  # scripts/openspec_index_repair.py, the workflow re-decides nothing); only an
  # index-only drift whose rewrite passes the generator's own check may land, as
  # a keeper PR — like the ledger PR (#802) it records drift and carries NO
  # closing keyword (rule 6e). `DRIFT=none` means the red had another cause: the
  # job says so and lands nothing. Any other red validate stays red for §6r.
  index-repair:
    name: index-repair (keeper PR for a stale generated index)
    needs: [guard, validate]
    if: >-
      failure() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: index-repair
      cancel-in-progress: false
    steps:
      - name: Checkout the exact master commit that went red
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Classify the index gate against this tree; regenerate when the drift is index-only
        run: |
          set -euo pipefail
          if ! make openspec-index-repair; then
            echo "index-repair could not classify the generated index (the script exits 2 on an unreadable one) — refusing to land anything."
            exit 2
          fi

      - name: Land the regenerated index as a keeper PR (owner PAT; records, never closes)
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          MASTER_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet -- OPENSPEC.md; then
            echo "OPENSPEC.md already matched the merged tree (DRIFT=none) — the red was not index staleness; no keeper PR."
            exit 0
          fi
          CHANGED=$(git status --porcelain)
          if [ "$CHANGED" != " M OPENSPEC.md" ]; then
            echo "The regeneration changed more than the generated index — refusing to land:"
            echo "$CHANGED"
            exit 1
          fi
          OPEN=$(gh pr list --repo "$REPO" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("ci/openspec-index-repair-"))] | length')
          if [ "$OPEN" -gt 0 ]; then
            echo "An index-repair keeper PR is already open — not opening a duplicate (one keeper per drift)."
            exit 0
          fi
          branch="ci/openspec-index-repair-$(date -u +%Y%m%dT%H%M%SZ)"
          make git-identity
          git switch -c "$branch"
          git add OPENSPEC.md
          git commit -m "chore(openspec): regenerate the generated index after a master merge left it stale (refs #304)"
          git push origin "HEAD:refs/heads/$branch"
          make openspec-index-repair-pr-body MASTER_SHA="$MASTER_SHA" RUN_URL="$RUN_URL" | gh pr create --base master --head "$branch" \
            --title "chore(openspec): repair the generated index left stale by a master merge" \
            --body-file -

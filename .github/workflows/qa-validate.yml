name: qa-validate

# CI pipeline — VALIDATION ONLY. Does NOT refresh data, does NOT run Hermes
# searches, does NOT merge, does NOT create PRs. It builds the self-contained
# Docker image (Python deps + Hermes CLI, cached) once, then calls the public
# `make` targets — which run inside that container:
#   make validate && make validate-search && make validate-mapped && make test
# If this is RED, fix-bot.yml re-runs Hermes to correct the data and pushes so
# this re-runs green.
#
# Local equivalent:
#   make docker-build && make validate && make test

on:
  pull_request:
    paths:
      - "**"
      - "!LICENSE"
      - "!.github/**"
  push:
    branches: [master]
    paths:
      - "**"
      - "!LICENSE"
      - "!.github/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: trending-local-llms:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Validate data store + README (full deterministic suite, in container)
        run: |
          make validate
          make validate-search
          make validate-mapped
          echo "QA passed: no models removed, fields+links present, backend tables sorted by t/s, JSON<->README sync, search contract, mapping, all models in README."

      - name: Run unit tests (in container)
        run: |
          make test

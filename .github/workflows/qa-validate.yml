name: qa-validate

# CI pipeline — VALIDATION ONLY. Does NOT refresh data, does NOT run Hermes
# searches, does NOT merge, does NOT create PRs. It builds the self-contained
# Docker image (Python deps + Hermes CLI, cached) once, then calls the public
# `make` targets — which run inside that container:
#   make validate && make validate-search && make validate-mapped && make test
# If this is RED, fix-bot.yml re-runs Hermes to correct the data and pushes so
# this re-runs green.
#
# Local equivalent:
#   make docker-build && make validate && make test

on:
  pull_request:
    paths:
      - "**"
      - "!LICENSE"
      - "!.github/**"
  push:
    branches: [master]
    paths:
      - "**"
      - "!LICENSE"
      - "!.github/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull the prebuilt base image from GHCR (pushed by refresh-bot) instead
      # of rebuilding it — the Hermes install + Python deps are baked in and
      # only rebuilt on Sunday. The image is public, so no login is needed.
      - name: Pull base image from GHCR
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest
          docker tag ghcr.io/${{ github.repository }}:latest trending-local-llms:latest

      # The base GHCR image only rebuilds on Sunday; test-only libs added
      # mid-week (markdown-it-py, tabulate for README-table validation) are not
      # in it. Build the dedicated TEST image which layers the current
      # requirements-test.txt on the base, so validate/test run with the libs
      # the repo actually pins (never the stale non-Sunday base).
      - name: Build test image (base + current test requirements)
        run: |
          docker build -f Dockerfile.test -t trending-local-llms-test:latest .

      - name: Validate data store + README (full deterministic suite, in container)
        run: |
          make validate
          make validate-search
          make validate-mapped
          # Real Firecrawl->lightbrd search run --dry-run --require-hits: proves
          # the Search actually returns data. HARD gate: fails if 0 model hits.
          make validate-fetch
          echo "QA passed: no models removed, fields+links present, backend tables sorted by t/s, JSON<->README sync, search contract, mapping, all models in README."

      - name: Run unit tests (in container)
        run: |
          make test

name: qa-validate

# PR CI — VALIDATION + AUTO-MERGE. Never refreshes data, never commits.
#
#   guard           action-pin-check (below): every third-party `uses:` ref and
#                   tool-image tag in this repo is pinned to an immutable 40-hex
#                   SHA; a mutable ref fails the gate. To bump an action, see
#                   "Bumping a pinned GitHub Action" in README.md.
#
#   validate        deterministic: data store, README, contracts, mapping, unit
#                   tests (incl. Makefile recipe, workflow wiring and fix-loop
#                   control-flow tests). A red validate dispatches nothing (issue
#                   #814): it stays red for the §6r sweep or a human.
#   live-smoke      REAL network, bounded: one real Hermes call through the
#                   search alias, the model-caps check and a real
#                   --require-hits search. NO lightbrd reachability probe: it
#                   timed out (522/read timeouts) and cancelled this job at 25m,
#                   reddening every PR on a third-party mirror (#1278/#1279).
#   auto-merge      when `validate` AND `live-smoke` are GREEN on a same-repo,
#                   non-draft PR: squash-merge exactly the validated head commit
#                   and delete the feature branch (owner PAT). Red -> stays open.
#
# Workflow-only PRs (.github/**) are validated too: the workflow wiring is
# itself under test (tests/test_workflows.py).
#
# Local equivalent:
#   make docker-build docker-test-build && make validate validate-search validate-mapped test
#   NOUS_API_KEY=... FIRECRAWL_API_KEY=... make pipeline-smoke validate-fetch

on:
  pull_request:
    paths:
      - "**"
      - "!LICENSE"
  push:
    branches: [master]
    paths:
      - "**"
      - "!LICENSE"
  workflow_dispatch:

permissions:
  contents: read

env:
  NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  # The nerve plugin's Jev provider credential (issue #120). Only the NAME the
  # plugin resolves is wired (`-e TYPESAFE_API_KEY` in the Makefile run
  # wrappers, AGENTS.md rule 3e) — an unset secret simply leaves the plugin
  # reporting its key missing, loudly, never a different provider.
  TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

# ---- run cancellation: a re-push stops this PR's superseded run (#1560) -----
#
# Owner directive (2026-11-24): a new push must STOP the previous CI run for that
# PR. This pipeline had NO `concurrency:` block, so a re-push left the old run
# going: measured on #1434, six master tips re-ran `qa-validate` while earlier
# runs were still queued, and the board has held five concurrent runs at once.
#
# `cancel-in-progress: true`: the next run in the SAME group cancels this one.
# The key carries the event name and the target, so a `pull_request`, `push`,
# `workflow_dispatch` or `issues` run never shares a group — each purpose
# cancels only its own superseded work. On a pull_request the target is the PR
# NUMBER (this PR's own group, e.g. `qa-validate-pull_request-1560`); every
# other event falls back to `github.ref` (`refs/heads/master` on push and
# dispatch). Another PR's number differs, so this can never touch another PR's
# run; a genuinely live, current run is cancelled only by a NEWER push to the
# same PR — exactly the superseded-head case.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Before anything reads a secret: owner, a write+ collaborator, or the bot
  # itself (rule 6j, issue #238). qa-validate is the ONLY pipeline that also runs
  # on the repository's OWN events, so its guard admits those outright — GitHub
  # starts a `pull_request`/`push` run for the repository itself (there is no
  # caller to admit), and a PR must be validated whatever its author. The
  # 30-minute, network-bound DISPATCH is what this guards (issue #279).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Owner / collaborator trigger guard
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT" in
            pull_request|push)
              echo "$EVENT is a repository event, not a dispatch - allowed."
              exit 0 ;;
          esac
          # Owner, the bot itself (github-actions[bot], a bot-to-bot dispatch), or
          # a collaborator with write/maintain/admin, for BOTH the actor and the
          # triggering actor (covers re-runs). Anything else - including an API
          # error - is refused.
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            if [ "$u" = "github-actions[bot]" ]; then echo "The bot itself ($u) - allowed."; continue; fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner, the bot, or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  validate:
    needs: guard
    runs-on: ubuntu-latest
    # `contents: read` is the workflow default; the lifecycle guard (rule 6f,
    # issue #183) also reads PR STATE, which needs pull-requests read and a token
    # in the environment. Nothing here writes.
    permissions:
      contents: read
      pull-requests: read
      # `issues: read` stays (the #779 lifecycle guard reads issue state); the
      # corrupt-tag-fallback announcement (issue #1120) is the ONE step that
      # raises `issues: write` at STEP level, so one marker comment never grants
      # the whole 30-minute job a write scope it does not use.
      issues: read
    # 20 -> 30: when the revision's Dockerfile is not published yet this job
    # builds the base from source before the suite (issue #135).
    timeout-minutes: 30
    outputs:
      # (issue #1120) the `corrupt-tag-fallback=<image>=<tag>` lines the two image
      # steps captured; `announce-fallback` is the only consumer, and it is the
      # only job in this pipeline that can write an issue comment.
      corrupt_fallback: ${{ steps.collect-fallback.outputs.corrupt_fallback }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The PR's OWN tree, never the merge result (issue #432). `pull_request`
          # otherwise checks out the MERGE COMMIT, so `make openspec-check` compared the
          # index with a tree that carries every other open change and reported
          # "[openspec-index] FAIL … (84 active on disk)" on a branch whose index was
          # current when it was written — three times in one session, and a PR could never
          # be green while a sibling merged first. The index is a generated file that every
          # change edits; it can only be verified against the tree that produced it.
          # `master`'s own index is verified by this pipeline's `push` run, and `auto-merge`
          # matches on the validated head SHA, so what merges is what was checked.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # FULL history: `make check-commit-authorship` reads the commits a PR
          # adds (`origin/master..HEAD`), and a shallow checkout has no base ref
          # — the guard would then fail loudly instead of checking anything
          # (issue #317).
          fetch-depth: 0

      # Cheapest gate first, and it needs no image: every tracked text file ends
      # with a newline (issue #186). A file stripped of its final newline turns
      # the next append into a spurious last-line change — git says
      # `\ No newline at end of file` — so the diff stops being honest.
      - name: Lint (every tracked text file ends with a newline)
        run: make lint

      # (issue #1209) The issue thread is the shared board across machines. CI
      # cannot see a host's profile home, but it can exercise the SAME seam the
      # host runs against ~/.hermes/profiles: here it proves the repo's lane bytes
      # and the AGENTS.md lifecycle rules match the checked-out commit. The
      # host half (BASE=origin/master, real profile home) is mandatory locally
      # after every fetch/pull; the test module covers the failure shapes.
      - name: Fleet lane behaviour matches the checked-out base (issue #1209)
        run: make fleet-host-sync-check BASE=HEAD PROFILES_HOME=agents

      # (issue #1464) The sync check refuses divergence but names no direction and offers no
      # remedy. This is the READ-ONLY half of the reconciliation seam: against the repo tree
      # it proves the classify/union logic on every PR without a host profile home. The write
      # path (WRITE=1, host home or DEST=<worktree>) is host-only by design.
      - name: Fleet mirror reconciliation seam (issue #1464)
        run: make fleet-host-reconcile BASE=HEAD PROFILES_HOME=agents

      # (issue #1266) The watcher's change detector is repo-owned: every host installs the
      # same markers. This is the offline half — no network, no credentials — so a PR
      # cannot remove the C/R/M contract or the check mode silently.
      - name: Watch monitor contract (issue #1266)
        run: make watch-monitor CHECK=1

      # (issue #1610 / #1265 design §5 Child 1) The report-only stale-claim sweep is repo-owned:
      # the DECISION about whether a working-claim is stale lives in ONE script, not in an
      # agent's prose. This is the offline half — no network, no credentials, no writes — so a
      # PR cannot remove the claim grammar, the grace pair or the marker shape silently. The
      # live half (`make stale-claim-sweep`) is a host read and emits nothing itself.
      - name: Stale claim sweep contract (issue #1610)
        run: make stale-claim-sweep CHECK=1

      # The only identities on this repo are Andy Holst and Asimov Agent. Nothing
      # read a commit's MESSAGE or a commit's IDENTITY, so a
      # `Co-authored-by: Hermes Agent <hermes@nousresearch.com>` trailer landed on
      # master. The trailer is SYNTHESIZED by GitHub at squash time from the AUTHOR
      # identity of a commit inside the PR (measured: 054b0c8), so the guard reads
      # the identity AND the message (issue #317). Git-only, no
      # image, so it sits with the other cheap gates.
      - name: No commit credits anyone but Andy Holst / Asimov Agent (issue #317)
        run: make check-commit-authorship

      # A merged PR must CLOSE the issue it implements (rule 6e). The body is the only
      # artifact with no guard on its content, and GitHub binds a closing keyword to ONE
      # reference: `Closes #1 and #2` closes #1 and leaves #2 open after the merge
      # (measured: PR #272 left issue #276 open). The check reads the webhook payload by
      # PATH ($GITHUB_EVENT_PATH) — nothing is interpolated into this run block, and it
      # needs no image, so it sits with the other cheap gates.
      - name: The PR closes the issue its branch implements (rule 6e)
        run: make pr-closure

      # (issue #1454) Rule 6g makes the analysis artifact MANDATORY for every
      # implementation run, but `make findings-check` ran only on the bot pipelines,
      # so a direct worktree PR could be green while its analysis was absent. This is
      # the same gate made SHAPE-AWARE through scripts/pr_closure.implementation_shaped
      # (the ONE parser, rule 6d): it reads the webhook payload by PATH and requires
      # the analysis file ONLY when the branch or body claims an implementation. Since
      # #1493 that file is per issue (`findings/<issue>.md`, resolved from the branch),
      # so two sibling PRs never collide on it. A keeper,
      # refresh, docs or architecture PR carries none and stays green (a bare wiring
      # would red every one of them — the §6q repo-wide-red hazard); a push to master
      # or a dispatch has no `pull_request` and is a green no-op.
      - name: An implementation-shaped PR carries its analysis (rule 6g, issue #1454)
        run: make findings-check-for-pr

      # The base image carries the pinned plugins (Dockerfile). Pull the PUBLISHED
      # base only when it was built from THIS revision's Dockerfile — the
      # published tag names the Dockerfile hash. Otherwise build from source, so a
      # Dockerfile change is exercised by its own CI run instead of silently
      # validating the previous base (issue #135: the guard's plugin-presence
      # assertion used to degrade to a note on a stale base).
      # ONE path for both images: pull each one when the tag naming this
      # revision's inputs is published, else build it here (issues #135/#141).
      # (issue #1120) the corrupt-tag fallback (#1118) prints one
      # `corrupt-tag-fallback=<image>=<tag>` line per rebuilt image; ONLY that
      # allowlisted key is written to GITHUB_OUTPUT (rule 3f — never whole
      # stdout), and the announce step below turns it into a PR comment.
      - name: Prepare runner images (published for this revision, else build)
        id: image-ensure
        env:
          IMAGE_FALLBACK_REPORT: ${{ runner.temp }}/image_fallback_report.txt
        run: |
          make image-ensure
          if [ -s "$IMAGE_FALLBACK_REPORT" ]; then
            FB=$(tr '\n' ' ' < "$IMAGE_FALLBACK_REPORT")
            printf '%s=%s\n' corrupt_fallback "$FB" >> "$GITHUB_OUTPUT"
            rm -f "$IMAGE_FALLBACK_REPORT"
          fi

      # FIRST: no credential may reach the repo. A finding here turns the PR red
      # (the same any-round gate) — remove the value and rotate the key,
      # never allowlist a real value (AGENTS.md rule 3d).
      - name: Secret scan (working tree) — gitleaks
        run: make secret-scan

      # …and prove the scanner itself works (a planted fake credential MUST be
      # caught): a scanner that silently does nothing is a false green.
      - name: Secret scan self-test (the planted credential is detected)
        run: make secret-scan-self-test

      # gitleaks only catches a committed credential VALUE. This guard catches
      # the run-time leak shapes — a printed value, a `-e KEY=$KEY`, a
      # `${{ secrets.X }}` in a `run:` block, an xtrace, an env dump, a committed
      # credential-shaped literal (issue #219).
      - name: No secret VALUE reaches a log/argv/env (check_secret_output)
        run: make check-secret-output

      # Immutable-SHA pin guard (issue #735, #714 Slice 1, folding #717): every
      # third-party workflow `uses:` ref must be a 40-hex SHA or on the allow-ref
      # list, and every third-party tool image must be pinned (digest or fleet
      # `<sha12>` tag) or allowlisted. Fails closed — a NEW mutable third-party
      # ref refuses the PR. Current refs are allowlisted with allow-till
      # deadlines (#714/#715 migration slices will pin them).
      - name: No mutable third-party workflow/tool-image ref (action-pin-check)
        run: make action-pin-check

      # The nerve credential reaches the container only as `-e` under the NAME
      # the plugin actually resolves — pinned plugin, no literal, and a loud
      # failure when the key is absent (issue #120, AGENTS.md rule 3e).
      - name: Nerve plugin credential guard (name only, never baked)
        run: make nerve-check

      - name: Validate data store + README + contracts (deterministic, in container)
        run: |
          make validate
          make validate-search
          make validate-mapped

      # Every change is a TRACKED change: its capability spec validates, its task
      # checklist is fully ticked and OPENSPEC.md (the root index of every change)
      # is current. `make openspec-check` also ensures the CLI image — pulled by
      # this revision's openspec/Dockerfile hash, built here when unpublished.
      # (issue #1120) same corrupt-tag capture as `image-ensure`: an openspec-CLI
      # rebuild must be announced too.
      - name: OpenSpec gate (changes validate, tasks ticked, index current)
        id: openspec-check
        env:
          IMAGE_FALLBACK_REPORT: ${{ runner.temp }}/openspec_check_report.txt
        run: |
          make openspec-check
          if [ -s "$IMAGE_FALLBACK_REPORT" ]; then
            FB=$(tr '\n' ' ' < "$IMAGE_FALLBACK_REPORT")
            printf '%s=%s\n' corrupt_fallback "$FB" >> "$GITHUB_OUTPUT"
            rm -f "$IMAGE_FALLBACK_REPORT"
          fi

      # (issue #1120) combine the two captured report keys into ONE job output.
      # The announcement itself lives in its OWN job (`announce-fallback` below):
      # a STEP cannot raise `GITHUB_TOKEN` scope, so the only way to give the
      # comment its `issues: write` without granting the whole 30-minute validate
      # job a write scope it never uses is a job boundary. validate keeps
      # `issues: read` for the #779 lifecycle guard (issue #1126).
      - name: Collect corrupt-tag fallback lines (issue #1120)
        id: collect-fallback
        run: |
          FB="${{ steps.image-ensure.outputs.corrupt_fallback }} ${{ steps.openspec-check.outputs.corrupt_fallback }}"
          FB=$(printf '%s' "$FB" | sed -e 's/^ *//' -e 's/ *$//')
          if [ -n "$FB" ]; then printf '%s=%s\n' corrupt_fallback "$FB" >> "$GITHUB_OUTPUT"; fi

      # Issue #1239: a PR-head-only index check cannot see a merge race. Two PRs can
      # each carry a correct OPENSPEC.md for their own base, yet the SECOND merge lands
      # an index computed when one fewer archive existed (measured: origin/master
      # `cebd71c7` said 394 while disk held 395). Verify the merge tree too; the PR-head
      # check above stays for sibling-change isolation (#432), and the post-merge
      # keeper (#304) stays as a backstop — no gate is weakened.
      - name: OpenSpec index on the merge tree (issue #1239)
        run: |
          set -euo pipefail
          # No --depth=1: the validate checkout uses fetch-depth: 0, and a shallow
          # fetch here would truncate the history that tests/test_commit_authorship.py
          # reads later in this same job (issue #1239 follow-up).
          git fetch origin master:refs/remotes/origin/master >/dev/null
          if ! git merge --no-commit --no-ff origin/master >/dev/null 2>&1; then
            git merge --abort >/dev/null 2>&1 || true
            echo "[merge-tree-index] MERGE CONFLICT: rebase on current master and retry"
            exit 1
          fi
          if ! make openspec-index-check; then
            echo "[merge-tree-index] FAIL: the index is stale on master + this PR."
            echo "[merge-tree-index] Run 'make openspec-index' and rebase on current master."
            exit 1
          fi
          git reset --hard HEAD >/dev/null

      # The lifecycle's END (rule 6f, issue #183): a change whose PR is merged must
      # be archived in the PR that completes it, so an ACTIVE change naming a
      # merged PR is a defect. PR state is a GitHub fact, read on the HOST with the
      # workflow token — `gh` is absent from the agent container, which is why this
      # is its own step rather than part of `make openspec-check`.
      - name: OpenSpec lifecycle (no active change names a merged PR; a closing PR must not strand its change)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: make openspec-archive-check PR="${PR_NUMBER:-}"

      # The reintroduction gate (issue #802): `data/pipeline_failures.json` records every
      # main-pipeline failure the filer diagnosed. A ledger entry whose fix landed must name a
      # guard test under tests/ that `make test` collects; an issue CLOSED with no fix PR and no
      # guard is RED — a closed pipeline failure without a guard is reintroducible, and this is
      # the pipeline that refuses it. Open entries are reported, never red.
      - name: Pipeline-failure ledger (every closed failure carries its guard; issue #802)
        env:
          GH_TOKEN: ${{ github.token }}
        run: make pipeline-failure-guard-check

      # The description is part of the change (rule 6h): every public make
      # target, workflow and script must be in ARCHITECTURE.md, and nothing it
      # names may be gone from the repository.
      - name: Architecture description (rule 6h)
        run: make architecture-check

      # The suite probes api.github.com for engine-registry metadata (rule 5b);
      # unauthenticated, the 60 req/h limit shared across NAT'd runner IPs reds
      # every PR on one aged WARN's probe (issue #1095, measured run 43896135854).
      # The job's own default token is forwarded BY NAME (rule 3e) — the value
      # never touches a command line — and fetch_repo_meta sends it as Bearer.
      - name: Run unit tests (in container)
        env:
          GH_TOKEN: ${{ github.token }}
        run: make test

  # (issue #1120) the corrupt-tag fallback (#1118) is green either way — but a
  # reviewer must be able to tell whether CI pulled the published, content-hashed
  # runner image or rebuilt it from the branch's own Dockerfile. This job is the
  # ONLY writer of a comment in this pipeline: a step cannot raise token scope,
  # so the write lives here and `validate` keeps `issues: read` (issue #1126).
  # ONE marker-deduplicated comment (registered `corrupt-tag-fallback`, stamped
  # `run=<id>`) names exactly which images were built without a pull, posted with
  # the DEFAULT github.token (the owner PAT cannot comment, rule 6e), and only on
  # a pull_request run that actually rebuilt something.
  announce-fallback:
    needs: [guard, validate]
    if: github.event_name == 'pull_request' && needs.validate.outputs.corrupt_fallback != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Announce corrupt-tag fallback on the PR (issue #1120)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGES: ${{ needs.validate.outputs.corrupt_fallback }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: make announce-image-fallback

  live-smoke:
    needs: guard
    runs-on: ubuntu-latest
    # Same build-from-source path as `validate` when the Dockerfile is fresh.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare runner images (published for this revision, else build)
        run: make image-ensure

      - name: Model caps (model served, max_tokens fits, accepts reasoning)
        run: make model-caps

      # Cadence + no-LLM directive (owner, 2026-11-15, issue #1029): the main CI
      # pipeline runs TESTS ONLY — no real model call. `make hermes-smoke` (a live
      # LLM round-trip) left this pipeline; real Hermes proof lives in the bot
      # pipelines that need the model (refresh / issue-bot / issue-review-bot),
      # which only guard-admitted identities can start and which no cron starts.

      # Hermes STRIPS provider credentials from the agent's terminal, so a key
      # that reaches the container can still be EMPTY in the agent's `curl`
      # (every refresh search leg: HTTP 401 with `FIRECRAWL_API_KEY: ***` set).
      # Real secrets, the bot image, Hermes's own terminal env (issue #359).
      - name: Agent shell sees every credential (_HERMES_FORCE_<NAME>)
        env:
          # GH_TOKEN is now in AGENT_SHELL_KEYS (issue #1095), and Actions does
          # NOT auto-inject GH_TOKEN — a job that names the key must forward it
          # BY NAME (rule 3e): the job's own default token, value never on a
          # command line. The key-check then proves the container sees it.
          GH_TOKEN: ${{ github.token }}
        run: make agent-shell-keys-check

      # Issue #1142: the rendered fleet chain must reach the profile home that RUNS a lane, and
      # the seam that does it must be executed by the pipeline (rule 6m), not only by a human.
      # NOUS_API_KEY is this workflow's own job env (name-level secret, rule 3e): the seam reads
      # only whether it is SET, never its value, and refuses with exit 2 naming the variable when
      # it is absent. $RUNNER_TEMP keeps a CI run out of any real profile home.
      - name: Fleet lane configs provision into a profile home (refuses without the chain's credential)
        run: make agent-profile-provision ALL=1 PROFILES_HOME="$RUNNER_TEMP/hermes-profiles"

      # Issue #1198: the chain's local-tier id must ALSO reach the auxiliary blocks the
      # provision seam does not own (custom_providers[strata] + moa presets). A stale
      # non-lane home is planted under $RUNNER_TEMP (never a real profile home), synced,
      # and --check must then read clean — the seam is executed by the pipeline (rule 6m).
      # No credential is needed: the seam writes only credential-less local-tier references.
      - name: Auxiliary blocks take the chain's local-tier id (sync, then check reads clean)
        run: |
          mkdir -p "$RUNNER_TEMP/hermes-profiles/aux-smoke"
          printf '%s\n' \
            'model:' \
            '  provider: custom' \
            '  default: meituan/longcat-2.5:free' \
            'custom_providers:' \
            '  - name: strata' \
            '    base_url: http://127.0.0.1:8080/v1' \
            '    model: qwen3.8-flash-next-q2_0' \
            '    models:' \
            '      qwen3.8-flash-next-q2_0:' \
            '        context_length: 131072' \
            'moa:' \
            '  presets:' \
            '    default:' \
            '      aggregator:' \
            '        model: qwen3.8-flash-next-q2_0' \
            '        provider: strata' \
            '        base_url: http://127.0.0.1:8080/v1' \
            > "$RUNNER_TEMP/hermes-profiles/aux-smoke/config.yaml"
          make agent-aux-local-sync PROFILE=aux-smoke PROFILES_HOME="$RUNNER_TEMP/hermes-profiles"
          make agent-aux-local-sync PROFILE=aux-smoke CHECK=1 PROFILES_HOME="$RUNNER_TEMP/hermes-profiles"

      # Issue #1214: the image the bot jobs run in must exist (published, or built
      # locally by image-ensure's designed fallback) and every provisioned fleet
      # profile must carry its SOUL/skills prompts. Tests only — no model call.
      - name: Agent image + fleet profile prompts reachable
        env:
          PROFILES_HOME: ${{ runner.temp }}/hermes-profiles
        run: make agent-image-smoke

      - name: Search returns data (real Firecrawl->lightbrd, --require-hits)
        run: make validate-fetch

  auto-merge:
    needs: [validate, live-smoke]
    if: >-
      success() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'master' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # #1049: the pre-squash rebase step pushes a REBASED bot-owned branch with the job's own
    # GITHUB_TOKEN (--force-with-lease pinned to the fetched tip). contents: write for THIS job
    # only; the merge itself stays the owner PAT's act. A human-owned branch is never pushed to.
    permissions:
      contents: write
    steps:
      # The job calls `make` (the closure proof below), and `make` needs the Makefile: a
      # `make` call in a job that never checked the repository out dies with
      # `No targets specified and no makefile found` (the measured class of issue #281).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # do-not-merge label hold (#722): GitHub-native auto-merge fires the instant
      # validate+live-smoke go green, which has twice merged an advisory-held PR
      # (#713, #719). Before the squash-merge step read the PR labels; if the
      # `do-not-merge` label is present, hold: echo the hold and exit without calling
      # `gh pr merge` so the PR stays OPEN and the run stays green/honest (a hold,
      # not a failure). The squash-merge step below also mirrors this in its `if:`
      # so a label that appears mid-run still pries the merge step off.
      - name: Hold if PR carries the do-not-merge label (#722)
        id: dnm-check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          LABELS=$(gh api "repos/$REPO/issues/$PR_NUM/labels" --jq '[.[] | .name] | join(",")')
          echo "PR #$PR_NUM labels: ${LABELS:-<none>}"
          if echo "${LABELS}" | tr ',' '\n' | grep -qx 'do-not-merge'; then
            echo "do-not-merge label present on PR #$PR_NUM — holding; will NOT auto-merge."
            echo "hold=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR #$PR_NUM not labeled do-not-merge — auto-merge allowed."
            echo "hold=false" >> "$GITHUB_OUTPUT"
          fi

      # #1049: auto-merge squashes the PR head as the author last pushed it, but a bot head's
      # generated OPENSPEC.md was rendered against the tree at BRANCH-CUT time — every archive
      # merged into master while the PR waited is absent from it, so the squashed tree lands a
      # stale index and the master push reds `openspec-index-check` (measured: keepers
      # #1038/#1045/#1046/#1047 ping-ponging; rebased bot branches 45fb245/5df9735/28bf765/9a5830a
      # red at the index gate on 2026-11-16). Before the squash, `make auto-merge-rebase` reads
      # the PR and classifies it against the FETCHED master (scripts/auto_merge_rebase.py, rule
      # 6d): a BEHIND-AND-CLEAN BOT-owned branch is rebased onto the fetched base, its
      # OPENSPEC.md REGENERATED on the rebased tree, and pushed --force-with-lease pinned to
      # the fetched tip (rule 6s ownership partition: a human-owned, conflicting, or already
      # current branch is reported and left exactly as it was). When a rebase lands, THIS run
      # skips the squash — its event head is now stale (`--match-head-commit` could only refuse
      # it) — and the PR's CI on the new, index-current head lands the merge. Skipping is
      # green and honest: the step names it in the log.
      - name: Rebase a behind-and-clean bot branch and regenerate its index before the squash (#1049)
        if: steps.dnm-check.outputs.hold != 'true'
        id: auto-merge-rebase
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          # (issue #1115) the rebase push carries the OWNER PAT identity: the measured ghost runs
          # (43839409260 / 43839409495 / 44004650575) followed this step's push done under the
          # job-token checkout credential, and the PR's next pull_request runs were action_required
          # with ZERO jobs. Reads stay on the default token; only the git push gets the PAT, through
          # the scripts/pr_health.py rebaser seam, which never prints it (rule 3d).
          GIT_PUSH_PAT: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # rule 3f: this step commits the regenerated index — set the agent identity first.
          make git-identity
          OUT=$(make auto-merge-rebase PR="$PR_NUM" REPO="$REPO")
          printf '%s\n' "$OUT"
          # rule 3d: parse an allowlist of keys, never the whole stdout
          rebased=$(printf '%s\n' "$OUT" | sed -n 's/^rebased=//p' | tail -1)
          printf 'rebased=%s\n' "${rebased:-false}" >> "$GITHUB_OUTPUT"

      # #1184: re-read the PR head IMMEDIATELY before the squash. The event SHA
      # was read when this run started; a host push since then would make
      # `--match-head-commit` refuse with "Head branch was modified" and leave
      # the PR BLOCKED with green checks from a head never validated. The seam
      # (scripts/auto_merge_head_check.py, rule 6d) names both SHAs and reports
      # head_moved=true; this run then SKIPS the squash (green, honest) and the
      # fresh pull_request run the push fired re-validates and merges the new head.
      - name: Refuse a squash whose PR head moved after validation (#1184)
        id: head-check
        if: steps.dnm-check.outputs.hold != 'true' && steps.auto-merge-rebase.outputs.rebased != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          OUT=$(make auto-merge-head-check PR="$PR_NUM" REPO="$REPO" EVENT_HEAD="$EVENT_HEAD")
          printf '%s\n' "$OUT"
          # rule 3d: parse an allowlist of keys, never the whole stdout
          moved=$(printf '%s\n' "$OUT" | sed -n 's/^head_moved=//p' | tail -1)
          printf 'moved=%s\n' "${moved:-true}" >> "$GITHUB_OUTPUT"

      # Squash-merge ONLY the exact commit that was validated (--match-head-commit):
      # a push after this run started leaves the PR open for the newer run.
      # Owner PAT, not GITHUB_TOKEN: a merge made with GITHUB_TOKEN starts no
      # workflows, so the post-merge qa-validate on master would never run.
      # #1049: `rebased=true` means this run's event head was just rewritten by the step
      # above — merging it here would squash the STALE head, so the squash is skipped and
      # CI on the new head lands the merge.
      # #1184: `moved=true` means the head moved since validation — skip too (above).
      - name: Squash-merge the green PR + delete its branch (owner PAT)
        if: steps.auto-merge-rebase.outputs.rebased != 'true' && steps.dnm-check.outputs.hold != 'true' && steps.head-check.outputs.moved != 'true'
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          STATE=$(gh pr view "$PR_NUM" --repo "$REPO" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR_NUM is $STATE — nothing to merge."
            exit 0
          fi
          # A bare `--squash` composes the squash commit from the PR TITLE ONLY:
          # no sections, no bound `Closes`, and master's own push gate
          # `make commit-message-check` (pr-closure.yml) REFUSES that message, so
          # every bot merge left master red (measured: run 43050329961 landed
          # squash d3d4116 as the title line alone, #779's closing lost in
          # transit). The landed commit must carry the merged PR's OWN title and
          # body: read them back from the PR and pass them explicitly. The body
          # goes through a file, never a shell interpolation — it is arbitrary
          # markdown, possibly with backticks and `$` (issue #787).
          gh pr view "$PR_NUM" --repo "$REPO" --json title --jq .title > squash-subject.txt
          gh pr view "$PR_NUM" --repo "$REPO" --json body --jq '.body // ""' > squash-body.txt
          test -s squash-subject.txt || { echo "PR #$PR_NUM has no title to merge"; exit 1; }
          gh pr merge "$PR_NUM" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA" \
            --subject "$(cat squash-subject.txt)" --body-file squash-body.txt
          # Then PROVE what the merge closed (issue #288): `make pr-closure` predicts it, this
          # reads the merged PR's own closing references a moment later. A body whose keyword
          # did not bind (the measured `Closes #271 and #276`) leaves a red run instead of a
          # green one over an issue that is still open.
          make verify-closure PR="$PR_NUM" REPO="$REPO"
          echo "Merged PR #$PR_NUM at $HEAD_SHA (validate + live-smoke green)"

  # The event-driven keeper for a red OpenSpec index gate (issue #304, rule 6q).
  # A merged PR archives its OpenSpec change, so master's tree no longer matches
  # the committed, generated OPENSPEC.md and the push-to-master `validate` goes
  # red — and a red master validate has no PR-side repairer: auto-merge of EVERY
  # open PR waits behind it (measured 2026-11-12: pushes 28f2cd3 and ce57e9b,
  # both red at the OpenSpec gate; auto-merge blocked repo-wide for hours).
  # This job runs only after a FAILED validate on a push to master, against the
  # exact post-merge tree that just went red. `make openspec-index-repair`
  # classifies the drift (rule 6d: the verdict DRIFT=none|index-only comes from
  # scripts/openspec_index_repair.py, the workflow re-decides nothing); only an
  # index-only drift whose rewrite passes the generator's own check may land, as
  # a keeper PR — like the ledger PR (#802) it records drift and carries NO
  # closing keyword (rule 6e). `DRIFT=none` means the red had another cause: the
  # job says so and lands nothing. Any other red validate stays red for §6r.
  index-repair:
    name: index-repair (keeper PR for a stale generated index)
    needs: [guard, validate]
    if: >-
      failure() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: index-repair
      cancel-in-progress: false
    steps:
      - name: Checkout the exact master commit that went red
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Classify the index gate against this tree; regenerate when the drift is index-only
        run: |
          set -euo pipefail
          if ! make openspec-index-repair; then
            echo "index-repair could not classify the generated index (the script exits 2 on an unreadable one) — refusing to land anything."
            exit 2
          fi

      - name: Regenerate the sibling inventory block so this keeper is green on both gates
        run: |
          set -euo pipefail
          # Both generated artifacts drift from the same merge (rule 6q). A keeper
          # carrying only OPENSPEC.md fails the sibling architecture-check gate, so
          # regenerate the inventory block too and land both files in one keeper.
          make architecture-refresh

      - name: Land the regenerated artifacts as a keeper PR (owner PAT; records, never closes)
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          MASTER_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # ONE landing sequence (issue #869): the nothing-to-land case, the extra-changes
        # refusal, the #960 mergeable-only keeper dedupe, the agent-identity commit/push and
        # the body from `make openspec-index-repair-pr-body` all live in scripts/keeper_pr.py;
        # this job names only THIS keeper's files, prefix, messages and body target.
        # Both generated files are owned so the keeper passes BOTH generated gates (#1339).
        run: |
          set -euo pipefail
          make keeper-pr FILE="OPENSPEC.md ARCHITECTURE.md" BRANCH_PREFIX=ci/openspec-index-repair DEDUPE=1 \
            COMMIT_MESSAGE="chore(keeper): regenerate both generated artifacts after a master merge left them stale (refs #304)" \
            PR_TITLE="chore(keeper): repair both generated artifacts left stale by a master merge" \
            BODY_TARGET=openspec-index-repair-pr-body \
            BODY_ARGS="MASTER_SHA=$MASTER_SHA RUN_URL=$RUN_URL"

  # The keeper for the THIRD way the OpenSpec gate goes red (issue #962, measured on
  # run 43610043055 / push aec1410): an ACTIVE change reached `master` structurally
  # incomplete — a bare `openspec/changes/<name>/proposal.md` with no
  # `specs/<capability>/spec.md` and no `tasks.md`. `openspec validate --changes`
  # refuses it, every open PR's `validate` waits behind it, and `index-repair`
  # answers `DRIFT=none` because the index really was current: the red had a named
  # cause and no named repairer. `make openspec-invalid-change-repair` archives the
  # incomplete change (its proposal declaring the #952 keeper exemption) and
  # regenerates the index; the verdict REPAIR=none|archived and the DRIFT=
  # invalid-change classification live in scripts/openspec_invalid_change_repair.py
  # and scripts/openspec_index_repair.py (rule 6d — this job re-decides nothing) and
  # it lands a PR only when the archive move plus OPENSPEC.md is all that changed.
  # It writes no spec and no task list: an incomplete change is archived and
  # declared, never completed by a keeper (rule 2). Like the other keepers it records
  # and carries NO closing keyword (rule 6e).
  invalid-change-repair:
    name: invalid-change-repair (keeper PR archiving an invalid active OpenSpec change)
    needs: [guard, validate]
    if: >-
      failure() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: invalid-change-repair
      cancel-in-progress: false
    steps:
      - name: Checkout the exact master commit that went red
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Archive every structurally incomplete active change (the verdict is the script's)
        run: |
          set -euo pipefail
          if ! make openspec-invalid-change-repair RUN_ID="${{ github.run_id }}"; then
            echo "invalid-change-repair could not classify the OpenSpec gate against this tree (the script exits 2 on an unreadable change tree) — refusing to land anything."
            exit 2
          fi

      - name: Land the archive as a keeper PR (owner PAT; records, never closes)
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          MASTER_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet -- OPENSPEC.md && [ -z "$(git status --porcelain)" ]; then
            echo "REPAIR=none — no ACTIVE change is structurally incomplete (the verdict is the script's). If this red was index staleness, index-repair owns that shape; if it was another gate, neither keeper lands here."
            exit 0
          fi
          CHANGED=$(git status --porcelain)
          # The repair moves an incomplete change into the archive and rewrites the
          # generated index. Anything else in the tree means this keeper is landing
          # more than its repair — refused, never narrowed by hand.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line:3}"
            case "$path" in
              openspec/changes/*|OPENSPEC.md) : ;;
              *)
                echo "The repair moved more than a change and the generated index — refusing to land:"
                echo "$CHANGED"
                exit 1 ;;
            esac
          done <<< "$CHANGED"
          # #960: only a MERGEABLE keeper suppresses a new one; a DIRTY/CONFLICTING
          # keeper lands nothing and must never stand in for the repair.
          KEEPERS=$(gh pr list --repo "$REPO" --state open --json headRefName,mergeStateStatus \
            --jq '[.[] | select(.headRefName | startswith("ci/openspec-invalid-change-repair-")) | .mergeStateStatus]')
          OPEN=$(echo "$KEEPERS" | jq '[.[] | select(. != "DIRTY" and . != "CONFLICTING")] | length')
          DIRTY=$(echo "$KEEPERS" | jq '[.[] | select(. == "DIRTY" or . == "CONFLICTING")] | length')
          if [ "$OPEN" -gt 0 ]; then
            echo "A mergeable invalid-change-repair keeper PR is already open — not opening a duplicate (one keeper per repair)."
            exit 0
          fi
          if [ "$DIRTY" -gt 0 ]; then
            echo "[keeper-dedup #960] An earlier invalid-change-repair keeper is open but UNMERGEABLE (mergeStateStatus DIRTY/CONFLICTING) — it lands nothing; filing a fresh keeper against the current tip."
          fi
          branch="ci/openspec-invalid-change-repair-$(date -u +%Y%m%dT%H%M%SZ)"
          make git-identity
          git switch -c "$branch"
          git add -A openspec/changes OPENSPEC.md
          git commit -m "chore(openspec): archive the invalid active change that reded master's OpenSpec gate (refs #962)"
          git push origin "HEAD:refs/heads/$branch"
          make openspec-invalid-change-repair-pr-body MASTER_SHA="$MASTER_SHA" RUN_URL="$RUN_URL" RUN_ID="$RUN_ID" \
            | gh pr create --base master --head "$branch" \
              --title "chore(openspec): archive the invalid active change left on master" \
              --body-file -

  # The sibling keeper for the OTHER generated half of the pair (issue #861, rule 6q):
  # `architecture-check` is a gate of the same `validate` job and goes red on the same
  # event — a merged PR that moved a target/script/job without `architecture-refresh`
  # (measured after merge `91eb093`: '201 make targets, 71 files' vs on disk '199…70…').
  # Before this job the only named keeper was the Wednesday-only `architecture-bot`, so
  # the merge queue sat red for days. The DECISION (DRIFT=none|block-only, exit 2 on a
  # malformed tree) lives in scripts/architecture_block_repair.py; this job re-decides
  # nothing (rule 6d) and lands a PR only when ARCHITECTURE.md is the only changed file.
  architecture-repair:
    name: architecture-repair (keeper PR for a stale generated inventory block)
    needs: [guard, validate]
    if: >-
      failure() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: architecture-repair
      cancel-in-progress: false
    steps:
      - name: Checkout the exact master commit that went red
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Classify the architecture block gate against this tree; regenerate when the drift is block-only
        run: |
          set -euo pipefail
          if ! make architecture-block-repair; then
            echo "architecture-repair could not classify the inventory block (the script exits 2 on a missing document, missing markers or a tree the generator refuses) — refusing to land anything."
            exit 2
          fi

      - name: Regenerate the sibling index so this keeper is green on both gates
        run: |
          set -euo pipefail
          # Both generated artifacts drift from the same merge (rule 6q). A keeper
          # carrying only ARCHITECTURE.md fails the sibling openspec-index-check gate,
          # so regenerate the index too and land both files in one keeper (#1339).
          make openspec-index

      - name: Land the regenerated artifacts as a keeper PR (owner PAT; records, never closes)
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          MASTER_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # ONE landing sequence (issue #869): the sibling of index-repair above — the whole
        # guard/dedupe/branch/commit/push/body chain lives in scripts/keeper_pr.py (rule 6d:
        # the #960 mergeable-only discriminator is fixed in ONE place, not re-typed per job).
        # Both generated files are owned so the keeper passes BOTH generated gates (#1339).
        run: |
          set -euo pipefail
          make keeper-pr FILE="OPENSPEC.md ARCHITECTURE.md" BRANCH_PREFIX=ci/architecture-block-repair DEDUPE=1 \
            COMMIT_MESSAGE="docs(keeper): regenerate both generated artifacts after a master merge left them stale (refs #861)" \
            PR_TITLE="chore(keeper): repair both generated artifacts left stale by a master merge" \
            BODY_TARGET=architecture-block-repair-pr-body \
            BODY_ARGS="MASTER_SHA=$MASTER_SHA RUN_URL=$RUN_URL"

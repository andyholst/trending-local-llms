name: qa-validate

# PR CI — VALIDATION + AUTO-MERGE. Never refreshes data, never commits.
#
#   validate        deterministic: data store, README, contracts, mapping, unit
#                   tests (incl. Makefile recipe, workflow wiring and fix-loop
#                   control-flow tests). This is what fix-bot can repair.
#   live-smoke      REAL network, bounded: the exact Firecrawl->lightbrd scrape
#                   for every nvidia / metal / cpu / amd search query (3s cap each),
#                   one real Hermes call through the search alias, and a real
#                   --require-hits search. Catches a dead key, a broken alias, a
#                   provider mis-route or an unreachable mirror on the PR,
#                   instead of 20 minutes into the next refresh. An outage here
#                   is infra, not data, so it never dispatches fix-bot.
#   dispatch-fixbot when `validate` is RED on a refresh PR (ci/trending-refresh-*),
#                   dispatch fix-bot with the owner PAT, capped at 2 fix-bot
#                   commits per PR so a fix that doesn't stick can't loop.
#   auto-merge      when `validate` AND `live-smoke` are GREEN on a same-repo,
#                   non-draft PR: squash-merge exactly the validated head commit
#                   and delete the feature branch (owner PAT). Red -> stays open.
#
# Workflow-only PRs (.github/**) are validated too: the workflow wiring is
# itself under test (tests/test_workflows.py).
#
# Local equivalent:
#   make docker-build docker-test-build && make validate validate-search validate-mapped test
#   NOUS_API_KEY=... FIRECRAWL_API_KEY=... make pipeline-smoke validate-fetch

on:
  pull_request:
    paths:
      - "**"
      - "!LICENSE"
  push:
    branches: [master]
    paths:
      - "**"
      - "!LICENSE"
  workflow_dispatch:

permissions:
  contents: read

env:
  NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  # The nerve plugin's Jev provider credential (issue #120). Only the NAME the
  # plugin resolves is wired (`-e TYPESAFE_API_KEY` in the Makefile run
  # wrappers, AGENTS.md rule 3e) — an unset secret simply leaves the plugin
  # reporting its key missing, loudly, never a different provider.
  TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # 20 -> 30: when the revision's Dockerfile is not published yet this job
    # builds the base from source before the suite (issue #135).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cheapest gate first, and it needs no image: every tracked text file ends
      # with a newline (issue #186). A file stripped of its final newline turns
      # the next append into a spurious last-line change — git says
      # `\ No newline at end of file` — so the diff stops being honest.
      - name: Lint (every tracked text file ends with a newline)
        run: make lint

      # The base image carries the pinned plugins (Dockerfile). Pull the PUBLISHED
      # base only when it was built from THIS revision's Dockerfile — the
      # published tag names the Dockerfile hash. Otherwise build from source, so a
      # Dockerfile change is exercised by its own CI run instead of silently
      # validating the previous base (issue #135: the guard's plugin-presence
      # assertion used to degrade to a note on a stale base).
      # ONE path for both images: pull each one when the tag naming this
      # revision's inputs is published, else build it here (issues #135/#141).
      - name: Prepare runner images (published for this revision, else build)
        run: make image-ensure

      # FIRST: no credential may reach the repo. A finding here turns the PR red
      # (the same gate fix-bot repairs) — remove the value and rotate the key,
      # never allowlist a real value (AGENTS.md rule 3d).
      - name: Secret scan (working tree) — gitleaks
        run: make secret-scan

      # …and prove the scanner itself works (a planted fake credential MUST be
      # caught): a scanner that silently does nothing is a false green.
      - name: Secret scan self-test (the planted credential is detected)
        run: make secret-scan-self-test

      # The nerve credential reaches the container only as `-e` under the NAME
      # the plugin actually resolves — pinned plugin, no literal, and a loud
      # failure when the key is absent (issue #120, AGENTS.md rule 3e).
      - name: Nerve plugin credential guard (name only, never baked)
        run: make nerve-check

      - name: Validate data store + README + contracts (deterministic, in container)
        run: |
          make validate
          make validate-search
          make validate-mapped

      # Every change is a TRACKED change: its capability spec validates, its task
      # checklist is fully ticked and OPENSPEC.md (the root index of every change)
      # is current. `make openspec-check` also ensures the CLI image — pulled by
      # this revision's openspec/Dockerfile hash, built here when unpublished.
      - name: OpenSpec gate (changes validate, tasks ticked, index current)
        run: make openspec-check

      # The description is part of the change (rule 6h): every public make
      # target, workflow and script must be in ARCHITECTURE.md, and nothing it
      # names may be gone from the repository.
      - name: Architecture description (rule 6h)
        run: make architecture-check

      - name: Run unit tests (in container)
        run: make test

  live-smoke:
    runs-on: ubuntu-latest
    # Same build-from-source path as `validate` when the Dockerfile is fresh.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner images (published for this revision, else build)
        run: make image-ensure

      - name: Search reachability — nvidia (HTTP 200 within 3s per query)
        run: make search-smoke BACKEND=nvidia
      - name: Search reachability — metal (HTTP 200 within 3s per query)
        run: make search-smoke BACKEND=metal
      - name: Search reachability — cpu (HTTP 200 within 3s per query)
        run: make search-smoke BACKEND=cpu
      - name: Search reachability — amd (HTTP 200 within 3s per query)
        run: make search-smoke BACKEND=amd

      - name: Model caps (model served, max_tokens fits, accepts reasoning)
        run: make model-caps

      - name: Hermes routing smoke (real call through the search alias)
        run: make hermes-smoke

      - name: Search returns data (real Firecrawl->lightbrd, --require-hits)
        run: make validate-fetch

  dispatch-fixbot:
    needs: validate
    if: >-
      failure() &&
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'ci/trending-refresh-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch fix-bot (owner PAT; capped at 2 fix-bot commits per PR)
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          MAX_FIXBOT_COMMITS: "2"
        run: |
          N=$(gh api "repos/$REPO/pulls/$PR_NUM/commits?per_page=100" \
                --jq '[.[] | select(.commit.message | startswith("fix-bot:"))] | length')
          echo "fix-bot commits already on PR #$PR_NUM: $N (cap $MAX_FIXBOT_COMMITS)"
          if [ "$N" -ge "$MAX_FIXBOT_COMMITS" ]; then
            echo "fix-bot already pushed $N fix(es) that did not turn CI green — leaving PR for manual review."
            exit 0
          fi
          gh workflow run fix-bot.yml --repo "$REPO" -f pr_number="$PR_NUM" -f branch="$BRANCH"
          echo "Dispatched fix-bot for PR #$PR_NUM ($BRANCH)"

  auto-merge:
    needs: [validate, live-smoke]
    if: >-
      success() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'master' && github.head_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # Squash-merge ONLY the exact commit that was validated (--match-head-commit):
      # a push after this run started leaves the PR open for the newer run.
      # Owner PAT, not GITHUB_TOKEN: a merge made with GITHUB_TOKEN starts no
      # workflows, so the post-merge qa-validate on master would never run.
      - name: Squash-merge the green PR + delete its branch (owner PAT)
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          STATE=$(gh pr view "$PR_NUM" --repo "$REPO" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR_NUM is $STATE — nothing to merge."
            exit 0
          fi
          gh pr merge "$PR_NUM" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          echo "Merged PR #$PR_NUM at $HEAD_SHA (validate + live-smoke green)"

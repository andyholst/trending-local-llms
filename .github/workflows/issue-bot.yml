name: issue-bot

# ISSUE-BOT pipeline — implements ONE newly-created data-gap issue (issue #113).
#
# Trigger surface is deliberately NARROW: `issues: [opened]` carrying the
# `data-gap-analysis` label (exactly what `make data-gap-issue` files), plus
# `workflow_dispatch` for the owner. It never reacts to a PR, a comment, an edit,
# a re-open or a label-less issue — and ONE issue gets ONE implementer:
# `concurrency: issue-bot-<issue number>` queues a second event instead of
# launching a parallel run for the same objective.
#
# Flow (all of it, or the run is a defect):
#   guard (owner/collaborator, BEFORE any secret is read)
#   -> resolve the issue (must be OPEN) into issue.md + branch slug
#   -> implement it with Hermes ON A FEATURE BRANCH, via `make implement-issue`
#   -> commit + push, open the PR (`closes #<n>`, owner PAT so CI really runs)
#   -> run the SAME fix loop as fix-bot against that PR until its pipeline is
#      green (scripts/fix_loop.sh: check -> report -> `make fix`, FIX_ROUNDS)
#   -> push the fixes (PAT) so qa-validate re-runs and its auto-merge job
#      squash-merges the PR with a proper commit message.
#
# The bot NEVER merges, never pushes master, and never invents data: a gap it
# cannot satisfy with a traceable value is reported on the issue instead
# (AGENTS.md rule 2, additive-only rule 3b, contract rule 6b, wiring rule 6d).

on:
  issues:
    types: [opened]
  # Backlog sweep (issue #127): hourly, off the hour. GitHub delays/drops
  # on-the-hour crons (the refresh-bot lesson), so this is :19. Hourly rather
  # than 6-hourly because the sweep implements ONE issue per run: a backlog of
  # N open gap issues (the analysis can file several in a day) drains in N
  # hours, and a sweep that finds nothing is a green no-op — so the cadence
  # costs nothing when there is no work. One run ONE issue — the oldest open
  # data-gap issue that has no implementer yet.
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to implement (owner only; empty = sweep the backlog)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: issue-bot-${{ github.event.issue.number || inputs.issue_number || 'sweep' }}
  cancel-in-progress: false

jobs:
  # Before anything touches a secret: only the owner or a collaborator with
  # write access may run issue-bot (it spends the Nous key and pushes with the
  # owner PAT). A stranger's issue can never start an implementation.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            echo "Scheduled run - allowed."
            exit 0
          fi
          # Owner, the bot itself (github-actions[bot], a bot-to-bot dispatch), or
          # a collaborator with write/maintain/admin, for BOTH the actor and the
          # triggering actor (covers re-runs). Anything else - including an API
          # error - is refused.
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            if [ "$u" = "github-actions[bot]" ]; then echo "The bot itself ($u) - allowed."; continue; fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner, the bot, or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  # The sweep's picker (issue #127): schedule only. Chooses ONE issue — the
  # oldest open data-gap issue WITHOUT an implementer yet (no ci/data-gap-<n>-*
  # branch, no open PR from such a branch). An empty backlog is a green run that
  # implements nothing. No checkout: the checks are API calls.
  pick:
    needs: guard
    # A sweep is EITHER the cron OR an owner dispatch with NO issue number
    # (measured: dispatching with an empty number skipped the picker and ran the
    # implement job with an empty issue — nothing picked, nothing done).
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.issue_number == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
    steps:
      # The queue rule (`oldest open data-gap issue with no implementer`, and the
      # reviewer's window) lives in scripts/issue_queue.py and is read by BOTH
      # bots through `make issue-queue` (issue #179): one implementation, no
      # second copy of the rule in shell. The checkout IS needed now — the job
      # reads the repo's own target instead of pasting the rule inline.
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Pick the oldest unhandled data-gap issue (the shared queue)
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          QUEUE=$(make issue-queue)
          echo "$QUEUE"
          # The head of the pick order (position=0) is the issue this sweep takes.
          PICK=$(printf '%s\n' "$QUEUE" | sed -n 's/^issue=\([0-9][0-9]*\) position=0 .*/\1/p' | head -1)
          if [ -z "$PICK" ]; then
            echo "data-gap backlog empty: every open labelled issue has an implementer, or a fresh reviewer verdict holds it."
            echo "issue=" >> "$GITHUB_OUTPUT"
          else
            echo "Sweeping #$PICK (oldest with no implementer, and no reviewer holding it)"
            echo "issue=$PICK" >> "$GITHUB_OUTPUT"
          fi

      # The reviewer's VERDICT is a hold, not advice (issue #200): a fresh
      # `needs-refinement` (or obsolete/duplicate/already-fixed) keeps the sweep
      # off an issue the reviewer judged not ready. When nothing was picked for
      # that reason, SAY SO ON THE ISSUE — one comment per review round, carrying
      # the reviewer's own timestamp — so "why is nobody working on this?" is
      # answered where the issue lives. A comment, never a label: the verdict
      # belongs to the reviewer (or a human), and this job never edits one.
      - name: Note a fresh reviewer verdict on the issue it holds
        id: verdict
        if: steps.pick.outputs.issue == ''
        env:
          # The default token has `issues: write`; the owner PAT is scoped to
          # Actions/Contents/Pull-requests and cannot comment (measured on #124).
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: make issue-skip-note

  implement:
    # `always()` so a SKIPPED pick (the issue/push paths) does not skip this job;
    # the guard and the per-path conditions below still gate it.
    needs: [guard, pick]
    if: >-
      always()
      && needs.guard.result == 'success'
      && (
        (github.event_name == 'workflow_dispatch' && inputs.issue_number != '')
        || (github.event_name == 'issues'
            && github.event.action == 'opened'
            && contains(github.event.issue.labels.*.name, 'data-gap-analysis'))
        || ((github.event_name == 'schedule'
             || (github.event_name == 'workflow_dispatch' && inputs.issue_number == ''))
            && needs.pick.outputs.issue != '')
      )
    # ONE implementer per issue ACROSS paths: an `issues: opened` event and a
    # sweep that picked the same issue share this group and queue instead of
    # racing. Evaluated when the job starts, so it can use the picked number.
    concurrency:
      group: issue-bot-issue-${{ needs.pick.outputs.issue || github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # The nerve plugin's Jev provider credential (issue #120): forwarded by NAME
      # only, as `-e TYPESAFE_API_KEY` in the Makefile run wrappers.
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      FIX_ROUNDS: "3"
      # This IS an implementation run: the fix loop demands the analysis file the
      # prompt must write (scripts/fix_loop.sh adds `make findings-check`), so a
      # run that skips it never reaches "green/pushed".
      REQUIRE_FINDINGS: "1"
    steps:
      # The DECISION only — no repository needed, on purpose (issue #281): this
      # step runs on a bare runner, so anything that calls `make` here dies with
      # `No rule to make target` before the checkout below has ever run. Measured
      # (run 38835373137): the sweep failed at step 2/19 and steps 3-18 — checkout,
      # base-check, images, smoke, announce, implement, push, PR, fix loop — were
      # ALL skipped, so the implementer could not implement anything.
      - name: Resolve the issue (open, labelled, one branch per issue)
        id: iss
        env:
          # Issue READS + the outcome comment use the default token: this job
          # declares `permissions: issues: write`, while FIXBOT_DISPATCH_TOKEN is
          # scoped to Actions/Contents/Pull-requests only — commenting on an issue
          # with it fails (measured: `GraphQL: Resource not accessible by personal
          # access token (addComment)` on the first run, #124).
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.pick.outputs.issue || github.event.issue.number || inputs.issue_number }}
        run: |
          STATE=$(gh api "repos/$REPO/issues/$ISSUE" --jq .state 2>/dev/null || echo "missing")
          if [ "$STATE" != "open" ]; then
            echo "Issue #$ISSUE is '$STATE' - nothing to implement."
            echo "implement=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SLUG=$(gh api "repos/$REPO/issues/$ISSUE" --jq .title \
            | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          BRANCH="ci/data-gap-${ISSUE}-${SLUG}"
          echo "implement=true" >> "$GITHUB_OUTPUT"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Implementing #$ISSUE on $BRANCH"

      - name: Checkout master (PAT, so its push re-triggers CI)
        if: steps.iss.outputs.implement == 'true'
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}

      # The base is FETCHED and ASSERTED before anything is implemented (issue #271,
      # rule 6n). A fresh `actions/checkout` is the latest `origin/master` only by
      # accident of the runner; an implementation started from an old base is green
      # locally and red on master, so this refuses to run rather than assume.
      - name: Assert the base is the freshly fetched origin/master
        if: steps.iss.outputs.implement == 'true'
        run: make base-check

      # Pull the prebuilt base (never rebuild it here) + build the TEST image.
      # ONE path for both images (issue #141).
      - name: Prepare runner images (published for this revision, else build)
        if: steps.iss.outputs.implement == 'true'
        run: make image-ensure

      # Fail in seconds, not after 20 minutes of implementing: one real Hermes
      # call through the alias the implementation uses.
      - name: Hermes routing smoke
        if: steps.iss.outputs.implement == 'true'
        run: make hermes-smoke

      # The WHOLE thread, not just the body (issue #210): the comments carry part
      # of the specification (a scope narrowing, a superseding PR), and the
      # renderer appends the decision instruction the implementer answers with in
      # triage.md. One implementation, tested. It runs HERE, after the checkout,
      # because `make issue-thread` is a repo target and the resolver above runs on
      # a bare runner (issue #281).
      - name: Read the whole thread (make issue-thread)
        if: steps.iss.outputs.implement == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.iss.outputs.issue }}
        run: |
          # A run with no thread would implement a specification it never read, so
          # an empty file is a loud failure, not an empty prompt.
          make issue-thread REPO="$REPO" ISSUE="$ISSUE" > issue.md
          test -s issue.md || { echo "::error::issue.md is empty — the issue thread did not render"; exit 1; }
          echo "issue.md: $(wc -l < issue.md) line(s)"

      # The WINDOW the issue reviewer defers to (issue #179): posted BEFORE the
      # body is read by the implementation, so the reviewer sees it while this run
      # is in flight and never rewrites the text this run implements — the text a
      # human reviews would otherwise differ from the text the PR implements.
      # Comments use the default token (`permissions: issues: write`): the owner
      # PAT is scoped to Actions/Contents/Pull-requests and cannot comment
      # (measured on #124: `Resource not accessible by personal access token`).
      - name: Announce the window on the issue (the reviewer defers to this)
        if: steps.iss.outputs.implement == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.iss.outputs.issue }}
          BRANCH: ${{ steps.iss.outputs.branch }}
        run: |
          {
            echo "<!-- issue-bot-start: $(date -u +%FT%TZ) -->"
            echo "**An implementer has started on this issue.**"
            echo ""
            echo "- branch: \`$BRANCH\`"
            echo "- run: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "The issue reviewer keeps a 3 h quiet window around this start: it will not"
            echo "rewrite this body while the window is open, because this run reads the body"
            echo "once, now — a rewrite would make the text a human reviews differ from the text"
            echo "this run implements. It replies on the issue instead and files what it finds"
            echo "as its own \`tech-debt\` issues."
          } > start.md
          gh issue comment "$ISSUE" --body-file start.md

      - name: Implement the issue (Hermes, through make)
        id: impl
        if: steps.iss.outputs.implement == 'true'
        run: |
          set +e
          make implement-issue
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" != "0" ]; then echo "implemented=false" >> "$GITHUB_OUTPUT"; else echo "implemented=true" >> "$GITHUB_OUTPUT"; fi
          exit 0

      # The implementer's verdict, applied DETERMINISTICALLY (issue #210). The
      # prompt requires `triage.md`; `make issue-verdict` is the only thing that
      # acts on it: `implement` does nothing (the run continues to its PR),
      # `refine` posts ONE restatement + `agent:refined`, `close` posts the reason
      # with its cited EVIDENCE, closes the issue and applies `agent:closed`. A
      # close with no EVIDENCE, or an unreadable verdict, exits 2 and fails this
      # step loudly — a verdict nobody understands must not be guessed at.
      # `set -o pipefail`: without it the step reports tee's status and a refused
      # verdict would look green.
      - name: Apply the implementer's verdict (make issue-verdict)
        id: verdict
        if: steps.iss.outputs.implement == 'true'
        env:
          # Comments/labels/closes use the default token (`permissions: issues: write`);
          # the owner PAT cannot comment on an issue (measured on #124).
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.iss.outputs.issue }}
        run: |
          set -o pipefail
          make issue-verdict | tee /dev/stderr >> "$GITHUB_OUTPUT"

      - name: Commit + push the branch
        id: push
        if: >-
          steps.iss.outputs.implement == 'true' && steps.impl.outputs.implemented == 'true'
          && steps.verdict.outputs.verdict == 'implement'
        env:
          BRANCH: ${{ steps.iss.outputs.branch }}
          ISSUE: ${{ steps.iss.outputs.issue }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The container writes files as root; make them committable.
          sudo chown -R "$(id -u):$(id -g)" .
          # One branch per issue: a re-run RESUMES the issue's branch instead of
          # failing on an existing one (never force-pushes). Both paths go through the
          # Makefile's ONE implementation of the rule (issue #271, rule 6n): `checkout
          # -b` here asserted nothing, and the resume could not work at all — the clone
          # held ONE ref (`actions/checkout` + `ref: master`), so `git checkout
          # "$BRANCH"` died with `pathspec ... did not match any file(s) known to git`.
          # `worktree-resume` fetches the branch first; `worktree-new` asserts this
          # checkout is still the fetched base tip before it cuts the branch from it.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            make worktree-resume BRANCH="$BRANCH" IN_PLACE=1
          else
            make worktree-new BRANCH="$BRANCH" IN_PLACE=1
          fi
          git add -A
          # ignored reporting artifacts, never named in the pathspec (git exits 1
          # on an ignored path under bash -e and the work would be lost)
          git reset -q -- qa-report.txt comment.md issue.md pr-body.md findings.md triage.md start.md issue-body.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "The implementation produced no file changes - nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scratch artifacts are not part of an implementation (an agent that
          # writes the AGENTS.md change into AGENTS_issue-<n>.patch is not
          # done). Never commit them.
          find . -maxdepth 2 -name '*.patch' -o -maxdepth 2 -name '*.rej' -o -maxdepth 2 -name '*.orig' | while read -r f; do
            [ -n "$f" ] && { echo "dropping scratch file $f"; git rm -q --cached "$f" 2>/dev/null || true; rm -f "$f"; }
          done
          git commit -m "feat(data-gap): implement #$ISSUE from the post-refresh gap analysis"
          # A push may be REJECTED by the remote even with a valid token: a
          # fine-grained PAT without `Workflows: Read and write` cannot create or
          # update .github/workflows/** ("refusing to allow a Personal Access
          # Token to create or update workflow ... without `workflow` scope",
          # measured on #120, run 38509118147). That is a token problem, not a
          # data problem: report it on the issue with the fix, don't die here.
          PUSH_OUT=$(git push -u origin "$BRANCH" 2>&1) || PUSH_RC=$?
          echo "$PUSH_OUT"
          if [ -n "$PUSH_OUT" ] && echo "$PUSH_OUT" | grep -qiE "refusing to allow a Personal Access Token|workflow.*scope"; then
            # Do NOT lose the implementation: the commit exists locally even
            # though GitHub refused the push. Hand it over as a patch artifact
            # (apply with `git am`) instead of re-running the agent (30 min) once
            # the token can push workflow files.
            git format-patch HEAD~1 --stdout > issue-implementation.patch 2>/dev/null || true
            ls -l issue-implementation.patch 2>/dev/null || echo "no patch produced"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "scope_error=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${PUSH_RC:-0}" != "0" ]; then
            echo "::error::git push failed for reasons other than the workflow scope (rc=${PUSH_RC})."
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open the PR (closes the issue, owner PAT)
        id: pr
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          BRANCH: ${{ steps.iss.outputs.branch }}
          ISSUE: ${{ steps.iss.outputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          cat > pr-body.md <<'BODY'
          Implements the filed data-gap issue from the post-refresh analysis.

          Spec-tracked: the change lives in `openspec/changes/` (proposal +
          capability spec in Given/When/Then + a tasks checklist with every box
          ticked), is listed in the root `OPENSPEC.md` index, and passes
          `make openspec-check`.

          Additive only: no existing key is removed or narrowed and no value is
          shrunk; a new key is OPTIONAL. Any value that could not be traced to a
          real source is left unset and called out in this body.

          Analysis ships issues: whatever the implementation noticed but did not
          fix is filed as its own `tech-debt` issue (linked to this PR) instead
          of being folded into this change.

          Auto-merged (squash, branch deleted) by qa-validate once `validate` and
          `live-smoke` are green on the head commit.
          BODY
          printf '\ncloses #%s\n' "$ISSUE" >> pr-body.md
          URL=$(gh pr create --base master --head "$BRANCH" \
            --title "feat(data-gap): implement the #$ISSUE gap analysis item" \
            --body-file pr-body.md 2>/dev/null)
          echo "pr_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Opened $URL"

      # The bot owns ITS OWN PR's pipeline: run the same loop fix-bot runs
      # (check -> report -> make fix, at most FIX_ROUNDS) and push only when green.
      - name: Fix loop against the PR branch
        id: loop
        if: steps.pr.outputs.pr_url != ''
        run: |
          set +e
          scripts/fix_loop.sh
          rc=$?
          if [ "$rc" = "0" ]; then echo "green=true" >> "$GITHUB_OUTPUT"; else echo "green=false" >> "$GITHUB_OUTPUT"; fi
          exit 0

      # ANALYSIS SHIPS ISSUES, NEVER CODE (AGENTS.md): the implementation recorded
      # what it touched in `findings.md`. `make findings-check` fails LOUDLY when
      # that analysis is missing (`- none` is the honest "found nothing"), and
      # `make file-findings` opens ONE issue per finding — label `tech-debt`,
      # deduped by signature, linked to #ISSUE and the PR — so a gap the change
      # noticed becomes its own tracked work item instead of being folded in.
      # Gated on the GREEN loop: a red run files nothing, and a re-run cannot
      # duplicate (the filing is idempotent).
      - name: File the gaps the implementation surfaced (its own issues)
        id: findings
        if: steps.loop.outputs.green == 'true'
        env:
          # Filing uses the default token: this job declares `issues: write`,
          # while the owner PAT is scoped to Actions/Contents/Pull-requests only.
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.iss.outputs.issue }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          PR_NUM=$(basename "${PR_URL:-unknown}")
          make findings-check
          make file-findings ISSUE="$ISSUE" PR="$PR_NUM"

      - name: Upload the QA report (what the loop saw)
        if: always() && steps.iss.outputs.implement == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: issue-bot-qa-report
          path: qa-report.txt
          if-no-files-found: ignore

      # A scope-rejected push must not throw the agent's work away: the commit is
      # attached so the owner can `git am` it the moment the token can push
      # .github/workflows/** (measured on #120, run 38509118147 — the work was
      # lost with the ephemeral runner).
      - name: Upload the unpushed implementation as a patch
        if: always() && steps.push.outputs.scope_error == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: issue-implementation-patch
          path: issue-implementation.patch
          if-no-files-found: ignore

      - name: Push the fixes (only when the loop is green)
        if: steps.loop.outputs.green == 'true'
        env:
          BRANCH: ${{ steps.iss.outputs.branch }}
          ISSUE: ${{ steps.iss.outputs.issue }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sudo chown -R "$(id -u):$(id -g)" .
          git add -A
          git reset -q -- qa-report.txt comment.md issue.md pr-body.md findings.md triage.md start.md issue-body.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Pipeline green with no extra changes."
            exit 0
          fi
          git commit -m "fix(issue-bot): drive the pipeline green for #$ISSUE"
          git push origin "$BRANCH"

      - name: Report the outcome on the issue
        # Only an `implement` run has an implementation to report: a refine or a
        # close already said everything in the verdict step's own comment.
        if: always() && steps.iss.outputs.implement == 'true' && steps.verdict.outputs.verdict == 'implement'
        env:
          # default token + `permissions: issues: write` (the PAT cannot comment)
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.iss.outputs.issue }}
          BRANCH: ${{ steps.iss.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          GREEN: ${{ steps.loop.outputs.green }}
          IMPLEMENTED: ${{ steps.impl.outputs.implemented }}
          SCOPE_ERROR: ${{ steps.push.outputs.scope_error }}
        run: |
          {
            echo "issue-bot ran for this issue (one implementer per issue)."
            echo ""
            echo "- branch: \`$BRANCH\`"
            echo "- implementation: ${IMPLEMENTED:-not started}"
            echo "- branch pushed: $( [ "${SCOPE_ERROR:-}" = "true" ] && echo "NO - token scope" || echo "yes" )"
            echo "- PR: ${PR_URL:-none opened}"
            echo "- own pipeline green: ${GREEN:-no}"
            if [ "${SCOPE_ERROR:-}" = "true" ]; then
              echo ""
              echo "**The push was rejected by GitHub, not by the data.**"
              echo ""
              echo 'The implementation touches `.github/workflows/**` and the pushing token cannot do that:'
              echo '`FIXBOT_DISPATCH_TOKEN` needs the **Workflows: Read and write** permission'
              echo '(classic PAT: the `workflow` scope). Until that is granted, an issue whose'
              echo 'implementation edits a workflow cannot be delivered by the bot.'
              echo ''
              echo 'The implementation is NOT lost: this run uploaded it as the artifact'
              echo '`issue-implementation-patch` (apply with `git am issue-implementation.patch`'
              echo 'after granting the permission), and the next sweep re-picks the issue if the'
              echo 'artifact is not used.'
            fi
            echo ""
            echo "Additive only (no existing key removed or narrowed, no value shrunk)."
            echo "Any value that could not be traced to a real source was left unset"
            echo "and is listed in this run's report artifact."
          } > comment.md
          gh issue comment "$ISSUE" --body-file comment.md

      # The implement step is soft-captured so the outcome comment still runs;
      # this is what makes the RUN red when there is nothing to review. Without
      # it the first real run (#124) failed only because the comment hit the
      # wrong token — the missing implementation itself was invisible.
      - name: Fail loudly when the implementation did not happen
        # Red when there is nothing to review: no implementation at all, OR an
        # implementation whose branch could not be pushed (token scope).
        # RED only when the run SAID `implement` and produced nothing: a refine or a
        # close is a complete outcome (the verdict step commented and labelled), so
        # it must not be reported as a failed implementation.
        if: >-
          always() && steps.iss.outputs.implement == 'true'
          && steps.verdict.outputs.verdict == 'implement'
          && (steps.impl.outputs.implemented != 'true' || steps.push.outputs.scope_error == 'true')
        env:
          RC: ${{ steps.impl.outputs.rc }}
          SCOPE_ERROR: ${{ steps.push.outputs.scope_error }}
          # without it the message reads "the push of the # branch" (measured on
          # run 38517245659)
          ISSUE: ${{ steps.iss.outputs.issue }}
        run: |
          if [ "${SCOPE_ERROR:-}" = "true" ]; then
            echo "::error::token scope: the push of the #$ISSUE branch was rejected because it edits"
            echo ".github/workflows/**. Grant FIXBOT_DISPATCH_TOKEN the 'Workflows: Read and write'"
            echo "permission (classic PAT: 'workflow' scope) and re-dispatch; the reason is also"
            echo "commented on the issue."
            exit 1
          fi
          echo "::error::issue-bot produced no implementation for #$ISSUE (make implement-issue rc=${RC:-unknown})."
          echo "See the 'Implement the issue' step above: the agent must exit non-zero on its own"
          echo "failure, and a missing alias / dead key / burned token budget is a pipeline defect,"
          echo "not a data problem."
          exit 1

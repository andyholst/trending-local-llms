# Queued-run alarm (issue #252).
#
# A job whose runner label matches nothing does not FAIL — it stays `queued` forever. The run
# never concludes, so every PR's checks sit at "pending" and `mergeStateStatus` stays BLOCKED
# with no signal anywhere. This sweep makes that state loud instead of silent.
#
# No conditional job anywhere: the DECISION lives in scripts/queued_run_alarm.py (it decides what
# counts as stuck and what to report), and the workflow calls it through `make queued-alarm`.
#
# Exit contract: the sweep exits 1 when at least one job is stuck, so the scheduled run goes RED
# (a stuck runner must be visible in the Actions tab, not only in a comment). Read-only apart
# from one deduplicated comment per affected run.
name: queued-alarm

on:
  schedule:
    - cron: "37 * * * 3"   # once a week, Wednesday (an odd minute; GitHub drops top-of-hour runs)
  workflow_dispatch:
    inputs:
      minutes:
        description: "report jobs queued longer than this many minutes"
        required: false
        default: "30"

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: queued-alarm
  cancel-in-progress: false

jobs:
  # Before anything reads a secret: owner, a write+ collaborator, or the bot itself; a scheduled
  # run passes (rule 6j, issue #238).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            echo "Scheduled run - allowed."
            exit 0
          fi
          # Owner, the bot itself (github-actions[bot], a bot-to-bot dispatch), or a collaborator
          # with write/maintain/admin, for BOTH the actor and the triggering actor (covers
          # re-runs). Anything else - including an API error - is refused.
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            if [ "$u" = "github-actions[bot]" ]; then echo "The bot itself ($u) - allowed."; continue; fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner, the bot, or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  alarm:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The filer half (issue #802) appends to `data/pipeline_failures.json` and lands that append
    # as a PR (the architecture-bot pattern): the ledger must reach master through a reviewed PR,
    # never a direct push (rule 1). The guard job and every other step keep the top-level reads.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Report jobs queued far too long, and comment once per affected run
        env:
          # The DEFAULT token, not the owner PAT: the run/job queries need `actions: read` and
          # the one comment needs `issues: write` (both held by this job), and AGENTS.md rule 6e
          # is explicit that the owner PAT CANNOT comment.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make queued-alarm REPO="${{ github.repository }}" \
            MINUTES="${{ inputs.minutes || '30' }}" COMMENT=1
      # A dropped cron has no run to look at, so the queue alarm above cannot see it: this reads
      # the ARTIFACT (the newest `schedule` delivery of the sweep) and goes RED when the hourly
      # sweep has not been delivered for MAX_AGE_HOURS (issue #497).
      - name: Fail loudly when the hourly sweep has not been delivered
        env:
          GH_TOKEN: ${{ github.token }}
        run: make sweep-alarm REPO="${{ github.repository }}" MAX_AGE_HOURS=3
      # An alarm over the ARTIFACT, not the run (issue #452): a refresh slot GitHub DROPPED leaves no
      # run row for any other alarm to read, so the only honest signal is the age of the newest
      # committed snapshot. Twice-daily crons leave a ~11.7 h gap; 14 h is one missed slot.
      - name: Fail loudly when the published index is stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: make freshness-alarm REPO="${{ github.repository }}" MAX_AGE_HOURS=14
      # A deterministic gate that goes red on a `push` to master has no repairer (issue #527): the
      # validate job of qa-validate runs on master push as well as on PRs, and dispatch-fixbot /
      # fix-bot / pr-health all need a PR (a push has none) while architecture-bot repairs only
      # ARCHITECTURE.md + OPENSPEC.md. So a red master stays red until a human notices. This alarm
      # reads the NEWEST push-to-master qa-validate run and goes RED when it concluded failure —
      # the same "a red or silent state must produce a signal" model as the alarms around it.
      - name: Fail loudly when the newest push-to-master qa-validate run is red (issue #527)
        env:
          GH_TOKEN: ${{ github.token }}
        run: make master-alarm REPO="${{ github.repository }}"
      # A red main pipeline must become a TRACKED ISSUE, not just a red run page (issue #802).
      # After the alarms, this filer reads every concluded-bad main-pipeline run inside the
      # window that is not yet in `data/pipeline_failures.json`, fetches the failed job's log,
      # extracts and SCRUBS the error block (rule 3f's redactor before anything is written), and
      # files one `tech-debt` issue carrying the run, the error block and the exact `make`
      # reproduction command — deduped by the ledger and the `pipeline-run-failure` marker.
      # Default token (rule 6e: the owner PAT cannot open issues); it never fixes anything — the
      # fix lands as its own reviewed change (rule 6g), and its closing PR must carry the guard
      # test that `make pipeline-failure-guard-check` refuses without.
      - name: Diagnose and file every unfiled main-pipeline failure from its logs (issue #802)
        env:
          GH_TOKEN: ${{ github.token }}
        run: make pipeline-failure-issue REPO="${{ github.repository }}"
      # The ledger append is worthless if it dies with the runner (rule 6m: a target CI runs must
      # also LAND). Same pattern as architecture-bot's generated-file PR: branch, one commit, PR
      # opened with the owner PAT (it can push and open PRs; it cannot comment — the filer above
      # used the default token for exactly that reason). The body carries NO closing keyword: this
      # PR implements no issue; it records the issues the fix PRs will close.
      - name: Land the ledger append as a reviewed PR (issue #802)
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/pipeline_failures.json; then
            echo "The filer appended nothing new — no ledger PR (the healthy weekly case)."
            exit 0
          fi
          branch="ci/pipeline-failure-ledger-$(date -u +%Y%m%dT%H%M%SZ)"
          make git-identity
          git switch -c "$branch"
          git add data/pipeline_failures.json
          git commit -m "chore(pipeline-failures): record the main-pipeline failures diagnosed by the weekly sweep (refs #802)"
          git push origin "HEAD:refs/heads/$branch"
          make pipeline-failure-ledger-pr-body RUN_URL="$RUN_URL" | gh pr create --base master --head "$branch" \
            --title "chore(pipeline-failures): record the diagnosed main-pipeline failures" \
            --body-file -
      # The owed-row ledger (issue #523): open issues declare the AGENTS.md §/row they are owed
      # via `owed-row` markers; this reports each declared row as LANDED (with its AGENTS.md
      # evidence line) or OUTSTANDING, so a covered issue is closable on evidence and the ledger
      # cannot rot open. A landed/outstanding row is news (exit 0); only an unreadable ledger or
      # a malformed marker is red (exit 2). It never edits a body, label or issue state (rule 6j).
      - name: Report the owed-row ledger against AGENTS.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: make owed-rows-check REPO="${{ github.repository }}"

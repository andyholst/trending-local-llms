# Queued-run alarm (issue #252).
#
# A job whose runner label matches nothing does not FAIL — it stays `queued` forever. The run
# never concludes, so every PR's checks sit at "pending" and `mergeStateStatus` stays BLOCKED
# with no signal anywhere. This sweep makes that state loud instead of silent.
#
# No conditional job anywhere: the DECISION lives in scripts/queued_run_alarm.py (it decides what
# counts as stuck and what to report), and the workflow calls it through `make queued-alarm`.
#
# Exit contract: the sweep exits 1 when at least one job is stuck, so the scheduled run goes RED
# (a stuck runner must be visible in the Actions tab, not only in a comment). Read-only apart
# from one deduplicated comment per affected run.
name: queued-alarm

on:
  # Cadence (owner directive 2026-11-15, issue #1029): this pipeline carries NO cron.
  # Only refresh-bot — the data-trend gatherer — keeps a schedule. This pipeline runs
  # on its own events and on owner/collaborator/bot workflow_dispatch; re-adding a
  # `schedule:` block here turns tests/test_workflows.py red on purpose.
  workflow_dispatch:
    inputs:
      minutes:
        description: "report jobs queued longer than this many minutes"
        required: false
        default: "30"

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: queued-alarm
  cancel-in-progress: false

jobs:
  # Before anything reads a secret: owner, a write+ collaborator, or the bot itself; a scheduled
  # run passes (rule 6j, issue #238).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Owner / collaborator trigger guard
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            echo "Scheduled run - allowed."
            exit 0
          fi
          # Owner, the bot itself (github-actions[bot], a bot-to-bot dispatch), or a collaborator
          # with write/maintain/admin, for BOTH the actor and the triggering actor (covers
          # re-runs). Anything else - including an API error - is refused.
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            if [ "$u" = "github-actions[bot]" ]; then echo "The bot itself ($u) - allowed."; continue; fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner, the bot, or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  alarm:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The filer half (issue #802) appends to `data/pipeline_failures.json` and lands that append
    # as a PR (the architecture-bot pattern): the ledger must reach master through a reviewed PR,
    # never a direct push (rule 1). The guard job and every other step keep the top-level reads.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Report jobs queued far too long, and comment once per affected run
        if: ${{ !cancelled() }}
        env:
          # The DEFAULT token, not the owner PAT: the run/job queries need `actions: read` and
          # the one comment needs `issues: write` (both held by this job), and AGENTS.md rule 6e
          # is explicit that the owner PAT CANNOT comment.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make queued-alarm REPO="${{ github.repository }}" \
            MINUTES="${{ inputs.minutes || '30' }}" COMMENT=1
      # A dropped cron has no run to look at, so the queue alarm above cannot see it: this reads
      # the ARTIFACT (the newest `schedule` delivery of the sweep) and goes RED when the weekly
      # sweep has not been delivered (issue #497). NO window literal here (issue #804): the
      # sweep asks for ONE delivery per Wednesday, so the window is sweep_alarm.py's own
      # weekly default — one implementation, rule 6d.
      # (issue #1029, owner directive 2026-11-15) the sweep is dispatch-only: no cron slot
      # to miss — the alarm now reds on a FAILED or HUNG dispatched sweep and reports a
      # clean bill when a dispatch-only sweep simply has no delivery owed.
      - name: Fail loudly when the sweep's newest delivery is red or hung
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: make sweep-alarm REPO="${{ github.repository }}"
      # An alarm over the ARTIFACT, not the run (issue #452): a refresh slot GitHub DROPPED leaves no
      # run row for any other alarm to read, so the only honest signal is the age of the newest
      # committed snapshot. The window is the script's own weekly default (170 h), NOT a
      # workflow literal: the 14 h override was the twice-daily era and red-ed dispatched
      # alarm runs on an ordinary weekly gap (issue #1031, the #804 treatment for sweep-alarm).
      - name: Fail loudly when the published index is stale
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: make freshness-alarm REPO="${{ github.repository }}"
      # A deterministic gate that goes red on a `push` to master has no repairer (issue #527): the
      # validate job of qa-validate runs on master push as well as on PRs, and the implementer's
      # fix loop and pr-health all act on PRs only (a push has none; the fix-bot pipeline was
      # retired by issue #814) while architecture-bot repairs only
      # ARCHITECTURE.md + OPENSPEC.md. So a red master stays red until a human notices. This alarm
      # reads the NEWEST push-to-master qa-validate run and goes RED when it concluded failure —
      # the same "a red or silent state must produce a signal" model as the alarms around it.
      - name: Fail loudly when the newest push-to-master qa-validate run is red (issue #527)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: make master-alarm REPO="${{ github.repository }}"
      # A red main pipeline must become a TRACKED ISSUE, not just a red run page (issue #802).
      # After the alarms, this filer reads every concluded-bad main-pipeline run inside the
      # window that is not yet in `data/pipeline_failures.json`, fetches the failed job's log,
      # extracts and SCRUBS the error block (rule 3f's redactor before anything is written), and
      # files one `tech-debt` issue carrying the run, the error block and the exact `make`
      # reproduction command — deduped by the ledger and the `pipeline-run-failure` marker.
      # Default token (rule 6e: the owner PAT cannot open issues); it never fixes anything — the
      # fix lands as its own reviewed change (rule 6g), and its closing PR must carry the guard
      # test that `make pipeline-failure-guard-check` refuses without.
      - name: Diagnose and file every unfiled main-pipeline failure from its logs (issue #802)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: make pipeline-failure-issue REPO="${{ github.repository }}"
      # The ledger append is worthless if it dies with the runner (rule 6m: a target CI runs must
      # also LAND). Same pattern as architecture-bot's generated-file PR: branch, one commit, PR
      # opened with the owner PAT (it can push and open PRs; it cannot comment — the filer above
      # used the default token for exactly that reason). The body carries NO closing keyword: this
      # PR implements no issue; it records the issues the fix PRs will close.
      - name: Land the ledger append as a reviewed PR (issue #802)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # ONE landing sequence (issue #869): scripts/keeper_pr.py lands it; the nothing-to-land
        # case prints the healthy weekly message and exits 0. No DEDUPE here: each sweep's
        # append is its own record and may land beside an older open ledger keeper.
        run: |
          set -euo pipefail
          make keeper-pr FILE=data/pipeline_failures.json BRANCH_PREFIX=ci/pipeline-failure-ledger \
            COMMIT_MESSAGE="chore(pipeline-failures): record the main-pipeline failures diagnosed by the weekly sweep (refs #802)" \
            PR_TITLE="chore(pipeline-failures): record the diagnosed main-pipeline failures" \
            BODY_TARGET=pipeline-failure-ledger-pr-body \
            BODY_ARGS="RUN_URL=$RUN_URL"
      - name: Report the owed-row ledger against AGENTS.md
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: make owed-rows-check REPO="${{ github.repository }}"
      # Hermes pin freshness (issue #1091, rule 6k): the Makefile's `HERMES_VERSION ?=` and the
      # Dockerfile's `ARG HERMES_VERSION` pin the agent version every fleet image bakes (issue #218
      # pins the two together). The check reads BOTH pins back — a silent disagreement is the #218
      # defect and refuses with exit 2 before the channel is even consulted — and compares the pin
      # against the upstream release channel (`repos/NousResearch/hermes-agent/releases/latest`):
      # equal → `pin=<v> channel=<v> OK` green; channel strictly NEWER → files ONE marker-
      # deduplicated tech-debt issue naming the remedy (raise BOTH pins together per #218) and
      # turns THIS sweep RED (exit 1) — a pinned build silently aging must not wait for the next
      # image dispatch to be noticed; pin ahead → reported, stays green; unreadable channel → red
      # (exit 2), never a silent clean. Files with the default token (filing needs issues:write).
      - name: Fail loudly when the Hermes agent pin lags the upstream release channel (issue #1091)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: make hermes-pin-freshness REPO="${{ github.repository }}"
      # Rule 1's mechanical guard (issue #959): "never push master directly" was a convention —
      # master had zero branch protection and two direct pushes landed on 2026-11-14 (e571aa3,
      # 4c7c555). master must carry the protection shape that admits ONLY the auto-merge squash
      # (strict required contexts validate + live-smoke, enforce_admins). The OWNER PAT reads it:
      # the default github.token cannot read branch-protection state. A silently-removed
      # protection turns THIS weekly sweep RED instead of restoring the unguarded state in
      # silence. The step is read-only — applying the setting is an owner-approved act (#959).
      - name: Fail loudly when master's branch protection is missing or weakened (issue #959)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
        run: make check-branch-protection REPO="${{ github.repository }}"

name: refresh-bot

# BOT pipeline — scheduled data refresh. Fully container-agnostic: builds the
# self-contained Docker image (Python deps + Hermes CLI) ONCE, pushes it to
# GHCR, and the four Hermes searches run as SEPARATE PARALLEL jobs that PULL
# the prebuilt image (each writes its own data/raw/<backend>-<UTC>.json), then
# a final job aggregates them (merge -> validate -> test) and opens a PR only
# when there is new data. Never merges itself; the PR is validated by
# qa-validate.yml; if its deterministic `validate` job is red the PR stays red
# for a human (the fix-bot dispatch was retired by issue #814). Green
# -> qa-validate's auto-merge job squash-merges it and deletes the branch.
#
# The PR is created with the owner-scoped PAT (FIXBOT_DISPATCH_TOKEN), NOT the
# default GITHUB_TOKEN: a PR authored by github-actions[bot] holds every
# pull_request run for manual approval, and pushes/PRs made with GITHUB_TOKEN
# do not trigger workflows at all. With the PAT, qa-validate starts on its own.
#
# Local equivalent:
#   make docker-build && NOUS_API_KEY=... FIRECRAWL_API_KEY=... make refresh

on:
  schedule:
    # Weekly, Wednesday 06:00 UTC, plus a backup slot at an odd time. GitHub delays (and
    # under load DROPS) scheduled runs, worst at the top of the hour: the
    # 06:00 run kept starting ~6 h late or not at all. 17:43 UTC is off the
    # :00 rush and far enough from 06:00 to cover a dropped morning run on the same day.
    # `concurrency` below queues the two if they ever overlap.
    - cron: "0 6 * * 3"

    - cron: "43 17 * * 3"

  workflow_dispatch:
    inputs:
      # Owner-only (the guard checks the actor): republish the base image even
      # when its Dockerfile hash tag already exists — for the case where a
      # merged Dockerfile change must reach the bots NOW instead of on Sunday.
      force_rebuild:
        description: "Rebuild + publish the base image even if it is current"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write

# One refresh at a time: a scheduled run and a manual run queue instead of
# racing to open competing PRs over the same generated files. The key is this
# workflow's own name — no other pipeline shares it — and `cancel-in-progress`
# stays FALSE because the gatherer WRITES the data store: a run in progress must
# finish, never be dropped half-written.
concurrency:
  group: refresh-bot
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest
  # The published tag that carries the Dockerfile hash the image was built from
  # (`dockerfile-<hash>`). A Dockerfile change is inert until the base is
  # rebuilt [#135], so the hash tag — not the Sunday cadence — decides it. The
  # same idea publishes the test image under `test-<hash>` [#141]; both tags come
  # from `scripts/ensure_image.py`, the definition consumers read too.
  IMAGE_REPO: ghcr.io/${{ github.repository }}
  TEST_IMAGE: ghcr.io/${{ github.repository }}-test:latest
  # The OpenSpec CLI image (openspec/Dockerfile): published here so `make
  # openspec-check` in qa-validate PULLS it instead of building Node on every PR.
  OPENSPEC_IMAGE: ghcr.io/${{ github.repository }}-openspec:latest

jobs:
  # Gate EVERY job: a scheduled run passes; a manual dispatch (or a re-run)
  # passes only when both the actor and the triggering actor are the repo
  # owner or a collaborator with write/maintain/admin. Previously only the search job checked, and `aggregate`
  # (if: always()) still ran — with secrets and the owner PAT — on a refusal.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Owner / collaborator trigger guard
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            echo "Scheduled run - allowed."
            exit 0
          fi
          # Owner, the bot itself (github-actions[bot], a bot-to-bot dispatch), or
          # a collaborator with write/maintain/admin, for BOTH the actor and the
          # triggering actor (covers re-runs). Anything else - including an API
          # error - is refused.
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            if [ "$u" = "github-actions[bot]" ]; then echo "The bot itself ($u) - allowed."; continue; fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner, the bot, or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  # Hermes pin freshness (issue #1091, rule 6k) — moved out of the dispatched
  # `queued-alarm.yml` sweep by the owner's ruling on issue #1093 (2026-11-19): queued-alarm is
  # dispatch-only (rule 6t), so a Hermes release newer than the pin waited for a dispatch and
  # produced no signal. THIS is the repository's only scheduled pipeline (rule 6t), so the
  # freshness check now runs on the cadence that actually arrives — the same weekly slot that
  # rebuilds the images. The check reads BOTH pins (the Makefile's `HERMES_VERSION ?=` and the
  # Dockerfile's `ARG HERMES_VERSION`, the #218 pair) — a silent disagreement refuses with exit 2
  # before the channel is consulted — and compares the pin with the upstream release channel read
  # from the Makefile's `HERMES_CHANNEL_REPO ?=` install pin (issue #1094): equal → OK green;
  # channel NEWER → ONE marker-deduplicated `tech-debt` issue naming the remedy (raise BOTH pins
  # together per #218) and this job goes RED; pin ahead → reported, green; unreadable channel →
  # red (exit 2), never a silent clean. A job `permissions:` block REPLACES the workflow's, so
  # this job reads the tree and writes the issue and touches no secret and no owner PAT.
  pin-freshness:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fail loudly when the Hermes agent pin lags the upstream release channel (make hermes-pin-freshness)
        env:
          GH_TOKEN: ${{ github.token }}
        run: make hermes-pin-freshness REPO="${{ github.repository }}"

  # The weekly free-tier refresh (issue #1195): the chain's free models are a LIVE truth, and a
  # remembered list silently rots — a new free model (the next Qwen) can only enter the chain
  # when someone re-reads the catalogue. This job is that re-read on the cadence that actually
  # arrives: rule 6t leaves refresh-bot as the ONLY scheduled pipeline, so the refresh rides its
  # Wednesday cron as a DETERMINISTIC job (no model anywhere — a read cannot fabricate a model).
  # It updates ONLY the free steps (the local_fallback tier and the paid pin are byte-untouched),
  # renders the lanes, and lands any change through the shared `make keeper-pr` seam: a reviewed
  # PR, never a direct push. A no-op (the healthy case) opens nothing.
  free-model-refresh:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The owner PAT, not the default token: a GITHUB_TOKEN push starts no workflows and a
      # GITHUB_TOKEN PR waits for an approval click (rule 6b), so the keeper PR would never merge.
      - name: Checkout master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          token: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}

      # Rule 6n: prove the checkout IS the freshly fetched base before the keeper cuts a branch.
      - name: Assert the base is the freshly fetched origin/master
        run: make base-check

      - name: Refresh the chain's free tier from the live catalogue
        env:
          NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
        run: make free-model-refresh

      - name: Render the lane configs from the refreshed chain
        run: make agent-profile-model-render

      # The landing sequence is the shared keeper seam (issue #1081): ONE `make keeper-pr` call
      # owns the branch, the identity, the commit, the push, the body and the #960 dedupe. The
      # lane file list is DERIVED from the tree (rule 6d), never hand-kept; the branch prefix's
      # UTC stamp ends in Z so pr_closure reads no trailing issue number (a keeper implements none).
      - name: Commit, push and open the PR when the free tier moved
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          make keeper-pr \
            FILE="agents/model_chain.json $(ls agents/tll-*/config.yaml | tr '\n' ' ')" \
            BRANCH_PREFIX=ci/free-model-refresh \
            DEDUPE=1 \
            COMMIT_MESSAGE="feat(fleet): refresh the chain's free tier from the live Nous catalogue (refs #1195)" \
            PR_TITLE="feat(fleet): weekly free-tier refresh from the live Nous catalogue" \
            BODY_TARGET=free-model-refresh-pr-body \
            BODY_ARGS="RUN_URL=$RUN_URL"

  # Build the image ONCE and push it to GHCR. The search + aggregate jobs PULL
  # this prebuilt image instead of rebuilding — so the Hermes install
  # (ADD install.sh + RUN) runs exactly once per run, not 6x.
  build:
    needs: guard
    runs-on: ubuntu-latest
    # Multi-arch (amd64 + arm64 under QEMU) builds need more headroom than a
    # single-arch build (issue #958; the openspec-image job allows 45).
    timeout-minutes: 45
    outputs:
      built: ${{ steps.decide.outputs.built }}
      test_built: ${{ steps.decide.outputs.test_built }}
      test_tag: ${{ steps.decide.outputs.test_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Decide whether to rebuild: when the image does NOT exist yet, when the
      # tag naming its inputs (`scripts/ensure_image.py`) is not published, when
      # it is SUNDAY (weekly cadence — the Dockerfile bakes a real Hermes
      # update via `make update-hermes` on that rebuild), or when a dispatch
      # forces it. Any other day reuses
      # the existing GHCR image, so the Hermes install/update runs at most once
      # per week instead of on every run.
      # The rebuild decision is DATA, computed by one tested unit (issue #208):
      # `make rebuild-decision` prints built/test_built/publish_openspec plus the
      # tags and the reasons, so every branch is covered by tests instead of being
      # observable only by running this pipeline. The day comes from the Makefile
      # (one `date +%u` call site in the repo), and `FORCE` is parsed strictly —
      # FORCE=0/false is OFF.
      - name: Decide whether to rebuild the images (make rebuild-decision)
        id: decide
        run: |
          # `key=value` ONLY (issue #346): never copy a command's whole stdout into
          # the log or into `$GITHUB_OUTPUT` — `make` echoes its recipe line, and a
          # wholesale copy is how a value nobody meant to print reaches a public
          # log. The capture + allowlist below keeps only the decision's keys; the
          # reasons are printed for the reader, not written to the output file.
          # `bash -e` is the runner's default, so a failed decision still fails the
          # step instead of leaving it green with EMPTY outputs (which would skip
          # every build below and silently stop rebuilding the toolchain).
          OUT=$(make rebuild-decision FORCE="${{ inputs.force_rebuild }}")
          for key in built test_built base_tag test_tag openspec_tag publish_openspec; do
            value=$(printf '%s\n' "$OUT" | sed -n "s/^${key}=//p" | head -1)
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
          done
          printf '%s\n' "$OUT" | sed -n '/^  (/p'
      - name: Cache Docker layers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            docker-${{ runner.os }}-
      - name: Build + push image (missing, Dockerfile changed, Sunday, or forced)
        if: steps.decide.outputs.built == 'yes'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          # BOTH architectures (issue #958, the pattern openspec-image proved
          # in #919): an amd64-only manifest makes ensure_image's published()
          # answer "pull it" on an arm64 host, where docker pull then dies
          # "no matching manifest for linux/arm64/v8".
          platforms: linux/amd64,linux/arm64
          # `latest` for consumers + the hash tag that records WHICH Dockerfile
          # this image was built from, so the next run can tell whether the
          # merged Dockerfile is already live. The tag comes from
          # `scripts/ensure_image.py` (the consumer's own definition).
          tags: |
            ${{ env.IMAGE }}
            ${{ steps.decide.outputs.base_tag }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
      - name: Image already current — skip rebuild
        if: steps.decide.outputs.built != 'yes'
        run: |
          echo "GHCR image exists and is built from this Dockerfile (hash tag published); reusing it."
      - name: Verify the base manifest answers both architectures (make image-manifest-check)
        # UNGATED, like the OpenSpec verify (issue #919): it checks the tag
        # that was JUST published — or the existing one the skip-rebuild path
        # reused — BEFORE any run pulls it. A legacy amd64-only tag for this
        # revision goes red here, not silently forever (issue #958).
        run: make image-manifest-check TAG="${{ steps.decide.outputs.base_tag }}" LABEL=base
      - name: Register arm64 emulation for the QEMU smoke (issue #1739)
        # The runner is amd64. buildx ran the arm64 build under its own
        # emulation, but the host-side `docker run --platform linux/arm64`
        # below needs a binfmt_misc handler registered ON THE RUNNER. Without
        # this step the arm64 child dies with `exec format error` (exit 255,
        # issue #1739) even though the published layer is a sound AArch64
        # image. This is emulation setup, not a second arch-selection contract:
        # the only platform set for publishing stays REQUIRED_PLATFORMS.
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: linux/arm64
      - name: Prove the arm64 base runs, not just exists (QEMU smoke)
        # Done-when for #958: "published multi-arch … and proven to install and
        # run under both". --platform linux/arm64 forces the arm64 variant of
        # the tag just verified; the handler registered above lets the runner
        # execute that arm64 child, proving the published artifact starts.
        run: |
          docker run --rm --platform linux/arm64 "${{ steps.decide.outputs.base_tag }}" hermes --version
          docker run --rm --platform linux/arm64 "${{ steps.decide.outputs.base_tag }}" cat /opt/hermes-version.txt

  # The TEST image is an image of its own: it layers the current
  # requirements-test.txt on the base and was previously built inline by every
  # job that needed it (four implementations of one stage, issue #141). It is
  # published under a tag naming THIS revision's inputs, on the same rules as
  # the base (missing tag / Sunday / forced), so runs pull it instead of
  # rebuilding it.
  test-image:
    needs: [guard, build]
    runs-on: ubuntu-latest
    # Multi-arch (amd64 + arm64 under QEMU) builds need more headroom (issue #958).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        # issue #552 guard: the `make test-image-smoke` step below matches the
        # suite-caller regex, so this checkout carries the full history.
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Docker layers (test image)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/.buildx-cache-test
          key: docker-test-${{ runner.os }}-${{ hashFiles('Dockerfile.test', 'requirements-test.txt') }}
          restore-keys: |
            docker-test-${{ runner.os }}-
      # Built FROM the published base: the `build` job above has just published
      # this revision's base (or reused it when the hash tag already matched).
      - name: Build + push the test image (missing, changed, Sunday, or forced)
        if: needs.build.outputs.test_built == 'yes'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.test
          push: true
          # BOTH architectures — same rule as the base build above (issue #958).
          platforms: linux/amd64,linux/arm64
          build-args: BASE_IMAGE=${{ env.IMAGE }}
          tags: |
            ${{ env.TEST_IMAGE }}
            ${{ needs.build.outputs.test_tag }}
          cache-from: type=local,src=/tmp/.buildx-cache-test
          cache-to: type=local,dest=/tmp/.buildx-cache-test,mode=max
      - name: Test image already current — skip rebuild
        if: needs.build.outputs.test_built != 'yes'
        run: |
          echo "The published test image is built from this revision's inputs; reusing it."
      - name: Verify the test manifest answers both architectures (make image-manifest-check)
        # UNGATED, both paths, before any job pulls it (issue #958).
        run: make image-manifest-check TAG="${{ needs.build.outputs.test_tag }}" LABEL=test
      - name: Prove the arm64 test image runs, not just exists (QEMU smoke, make test-image-smoke)
        # The test layer's libraries importing under arm64 QEMU is the run
        # proof for this image (issue #958 Done-when). The docker run lives in
        # the Makefile target — a workflow `run:` step may reach the product
        # only through make (rule 6m; the raw inline interpreter probe here
        # reded `make test`'s test_makefile_only guard on PR #1114).
        run: make test-image-smoke TAG="${{ needs.build.outputs.test_tag }}"

  # The OpenSpec CLI image (openspec/Dockerfile) — the container `make openspec-*`
  # runs in. Published on the SAME rule as the other two: the tag names the
  # contents it was built from (`scripts/ensure_image.py tags`), so `make
  # openspec-check` in qa-validate pulls it for this revision instead of running
  # `npm install` in a fresh Node image on every PR, and a merged
  # openspec/Dockerfile becomes live by its own hash tag.
  openspec-image:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide whether to publish the OpenSpec image (make rebuild-decision)
        id: decide
        run: |
          # `key=value` ONLY — see the images decision above (issue #346).
          OUT=$(make rebuild-decision)
          for key in publish_openspec openspec_tag; do
            value=$(printf '%s\n' "$OUT" | sed -n "s/^${key}=//p" | head -1)
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
          done
      - name: Build + push the OpenSpec image (its hash tag is not published)
        # `publish_openspec=yes` means the decision FOUND a publish reason
        # (the hash tag is missing) — the SAME polarity as the base image's
        # `built == 'yes'` gating above. The old wiring gated the build on
        # 'no', so a merged openspec/Dockerfile change published NOTHING and
        # the run died at openspec-manifest-check with "manifest unknown"
        # (measured on runs 43658287668 / 43676720912, issue #989).
        if: steps.decide.outputs.publish_openspec == 'yes'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: openspec
          file: openspec/Dockerfile
          push: true
          # Multi-architecture manifest (issue #919): an amd64-only tag makes
          # `docker pull` die on arm64 hosts with "no matching manifest" — the
          # issue-#767 failure a fresh arm64 checkout still hits.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.OPENSPEC_IMAGE }}
            ${{ steps.decide.outputs.openspec_tag }}
      - name: OpenSpec image already current — skip rebuild
        if: steps.decide.outputs.publish_openspec == 'no'
        run: echo "The published OpenSpec image is built from this revision's openspec/Dockerfile; reusing it."
      - name: Verify the manifest answers both architectures (make openspec-manifest-check)
        # Runs on BOTH paths (issue #919): a legacy amd64-only tag for this
        # revision must be refused here, not reused forever by the skip branch.
        run: make openspec-manifest-check TAG="${{ steps.decide.outputs.openspec_tag }}"

  # Four independent searches (nvidia, metal, cpu, amd), run in parallel. Each PULLS the prebuilt image
  # (no rebuild), writes its own raw snapshot, and uploads it as an artifact.
  search:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [nvidia, metal, cpu, amd]
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      # The Hugging Face token (issue #363): every leg records an HF link per model
      # (rule 5b), and an unauthenticated huggingface.co API call is rate-limited — a
      # gated repo answers 401/429, reads as missing, and the leg writes the marketing
      # name instead of the canonical id (the dead-link class #333 fixed at ingest).
      # `AGENT_SHELL_KEYS` forwards a credential only when the JOB sets it, so without
      # this line the agent's shell never had it however the run wrappers forward the
      # name. `_search-preflight` proves BOTH credentials in the agent's shell before
      # the 20-minute search starts.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # The nerve plugin's Jev provider credential (issue #120): forwarded by NAME
      # only, as `-e TYPESAFE_API_KEY` in the Makefile run wrappers.
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare the base image (published for this revision, else build)
        run: make image-ensure-base

      # One real Hermes call through the search alias before the 20-minute
      # search: a dead key / broken alias / provider mis-route fails here in
      # seconds instead of after the search burned its budget.
      # The endpoint silently clamps max_tokens to the model's real cap; a
      # mismatch (or a model that can't switch reasoning off) burns the budget.
      - name: Model caps (model served, max_tokens fits, accepts reasoning)
        run: make model-caps

      - name: Hermes routing smoke
        run: make hermes-smoke

      - name: Hermes search (${{ matrix.backend }})
        run: |
          make search-${{ matrix.backend }}

      # Report NOW (not first at PR CI) any engine this leg found that isn't
      # registered, and what ingest will decide: registered (real engine with
      # a verified GitHub repo) / not-engine (harness, app, benchmark) /
      # unknown / no-repo. Report only — never fails the leg.
      - name: Engine check (report only)
        run: make engine-check

      - name: Upload raw snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raw-${{ matrix.backend }}
          path: data/raw/*.json
          # A search that finds no new data (or can't reach the source) is
          # tolerated, not a hard failure — the refresh is resilient by design
          # (AGENTS.md: preserve last-known data, never blank the store).
          if-no-files-found: warn

  # Aggregate: download all four raw snapshots, merge into models.json + README,
  # validate + test, then open a PR if there is new data.
  aggregate:
    needs: [guard, build, search]
    # Run even if one or more search jobs failed (a backend that found no data
    # or couldn't reach the source must not abort the whole refresh). Merge
    # whatever searches DID produce data and still open a PR.
    # Tolerate a failed search leg (merge what the other legs found), but
    # NEVER run on a refused guard or a failed build.
    if: always() && needs.guard.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job WRITES AN ISSUE (the data-gap filing), and issue writes — creating
    # the issue, and applying the `data-gap-analysis` label the whole bot chain
    # triggers on — need `issues: write` on the token that performs them. The
    # owner PAT declares no Issues scope (AGENTS.md §6b: "issue reads and comments
    # use the default github.token with permissions: issues: write"), so the
    # default token is used for that step and this job asks for the scope it uses.
    # Job-level permissions REPLACE the workflow-level set, so this repeats the two
    # the job really needs (branch push + PR) and drops `packages: write`, which
    # only the image jobs use (they log in to GHCR themselves).
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # The nerve plugin's Jev provider credential (issue #120): forwarded by NAME
      # only, as `-e TYPESAFE_API_KEY` in the Makefile run wrappers.
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      # PAT checkout: the branch push below is then made as the owner, so the
      # PR's qa-validate run starts without an approval click.
      #
      # FULL history (`fetch-depth: 0`), because this job is the one that runs the
      # QA pass (`make qa-report` → validate + test) and `make test` includes
      # `check-commit-authorship`, which reads `git log origin/master..HEAD`
      # (issue #552). `actions/checkout` defaults to a depth-1 clone, so the guard
      # failed here BY CONSTRUCTION on every refresh — measured on run 40126898852:
      # `[qa-report] make test reported findings (rc=2)`, `is-shallow-repository=true`.
      # That made the whole QA pass permanently red, and because the aggregate
      # deliberately treats it as advisory ("data still lands for review") the red
      # was indistinguishable from noise: a real defect in the data or in a module
      # looked exactly like the standing failure, and the run stayed green.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          fetch-depth: 0

      # This job cuts `ci/trending-refresh-<UTC>` off master and pushes it as a PR:
      # the base it cuts from is FETCHED and ASSERTED first (issue #271, rule 6n).
      # A fresh `actions/checkout` is the latest `origin/master` only by accident of
      # the runner, and a PR built on an old base is the overlapping-PR conflict in
      # reverse: it validates a tree that has already moved.
      #
      # It ADVANCES rather than refusing (issue #448). The search legs above run for
      # ~40 min while `master` routinely merges, so this checkout is behind by
      # construction — `make base-check` would refuse here and throw away four green
      # legs (measured: run 39329834698, HEAD 2 commits behind, whole refresh lost).
      # Nothing has been written to the tree at this point (the raw snapshots arrive
      # below as artifacts), so the honest answer is to move to the fetched tip;
      # `base-advance` still refuses a dirty tree or a HEAD with its own commits.
      - name: Advance the clean checkout onto the freshly fetched origin/master
        run: make base-advance

      # BOTH images: this job's steps run test-image targets (`make data-gaps`,
      # `make test`), and preparing only the base left `data-gaps` dying with
      # "Unable to find image 'trending-local-llms-test:latest'" (issue #145).
      - name: Prepare the runner images (published for this revision, else build)
        run: make image-ensure

      - name: Download raw snapshots
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: data/raw
          pattern: raw-*
          merge-multiple: true

      - name: Engine check across all legs (report only)
        run: make engine-check

      - name: Merge + validate + test (in container)
        run: |
          # Run the direct Firecrawl->lightbrd search + merge: gathers engagement
          # the Hermes prompts also capture, and exercises the --fetch integration.
          make merge-fetch
          # The merge is what auto-registers a new engine; record its GitHub
          # metadata into the offline test fixture straight away, so this PR is
          # not red on `make test` for an engine it just gained (issue #334).
          make engine-meta-capture
          # Record the Hermes release-channel payload through the ONE seam (issue #1163):
          # tests/fixtures/hermes_releases_latest.json is what `make test`'s offline half
          # asserts against, and nothing wrote it — a pin raise hand-copied
          # `gh api …/releases/latest` into it, the step that silently goes stale. A failed
          # read refuses loudly (exit 2) and writes nothing, so a network blip never
          # truncates the fixture.
          make hermes-pin-channel-record TO=tests/fixtures/hermes_releases_latest.json
          # Self-correct raw snapshots FIRST (prune extra keys, fill last_seen)
          # so _validate sees contract-conforming data. Previously validate ran
          # before self_correct_raw (only in validate-search) and the aggregate
          # aborted on raw snapshots with extra fields / missing last_seen.
          make correct-raw
          # Validation is SOFT for FINDINGS (like _refresh): a data-quality
          # finding is reported but does NOT abort — the merged data still lands
          # as PR, qa-validate flags it for review (issue #814 retired the
          # fix-bot repair dispatch).
          # A target that could not run at all (no image, no command: docker
          # 125/127) is NOT a finding and fails the job — the previous
          # `|| echo` guards reported that state as a green run (issue #147).
          make qa-report

      - name: Data-gap analysis (report only)
        run: make data-gaps

      - name: File a data-gap issue when the gap set changed (issue #115)
        # Report-only: a failure here never fails the data PR. That promise needs
        # continue-on-error — without it the job went red and the PR step was
        # skipped (run 38549751388, issue #150). It still shows as a failed step.
        continue-on-error: true
        env:
          # `gh` + the repo live on the runner, not in the test image, so
          # `make data-gap-issue` runs here (issue #150).
          #
          # The DEFAULT token, with `issues: write` on this job — NOT the owner
          # PAT (issue #277). Measured: the PAT declares no Issues scope, so
          # `gh issue create --label data-gap-analysis` returned 0 having applied
          # NO label, `ensure_label` re-applied it and it did not stick, and the
          # step failed — silently, behind `continue-on-error`. The filed issue
          # was invisible to BOTH bots (`make issue-queue` -> `candidates=0`,
          # `make review-issue-pick` -> `action=none`), so the implementer and the
          # reviewer skipped their work every run, and the same gap set was filed
          # twice (#246, #266) because the dedup search filters by that label.
          # This is the same token rule AGENTS.md §6b states for comments
          # (#124): issue writes use the default token.
          GH_TOKEN: ${{ github.token }}
        run: make data-gap-issue
        # The baseline (data/gap_baseline.json) is written by `make data-gap-issue`
        # when it files, so a day with the same gap set files nothing.

      - name: Commit + open PR if changed
        id: pr
        env:
          # Owner PAT — see the header: a GITHUB_TOKEN-authored PR is held for
          # approval and never auto-starts qa-validate.
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
        run: |
          # data/gap_baseline.json is in BOTH lists on purpose (issue #152): the
          # filer writes it in the step above, and leaving it out meant the new
          # baseline was discarded every run — so the next refresh compared
          # against a stale baseline and filed the SAME gap issue again (and a
          # baseline-only change printed "No data changes" over a dirty tree).
          # tests/fixtures/github_meta.json is in BOTH lists for the same reason:
          # `make engine-meta-capture` above records what a refresh that
          # registered an engine read from GitHub, and leaving it out meant the
          # PR never carried the fixture — so `make test` on the PR reds the
          # engine `make validate` just admitted (the issue #334 failure), and a
          # meta-only change printed "No data changes" over a dirty tree.
          if git diff --quiet -- README.md data/models.json data/snapshots data/raw data/gap_baseline.json data/measurements.json data/posts.json tests/fixtures/github_meta.json; then
            echo "No data changes — no PR opened."
            echo "pr_opened=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="ci/trending-refresh-$(date +%Y%m%d-%H%M)"
            # The repo's own agent identity (issue #323, guard scripts/check_commit_authorship.py):
            # the only identities here are Andy Holst and Asimov Agent.
            make git-identity
            # PUBLISH ON THE BASE AS IT IS NOW (issue #177). Every file this PR carries
            # is GENERATED and every other merge rewrites it, so a branch cut from a
            # base the queue has already left is a whole-file conflict waiting for
            # `auto-merge` — measured on PR #164: rebased twice in one hour, then
            # `GraphQL: Pull Request has merge conflicts` while `validate` and
            # `live-smoke` were green. The search legs ran before this job and `master`
            # merges while they do, so the base is fetched AGAIN here, the generated
            # tree is moved onto it (the raw snapshots survive) and `make merge`
            # re-derives the store, README and baseline from those snapshots. Nothing
            # is applied from an older base, so there is no file to conflict on.
            # The container above wrote the generated files as root; `git reset --hard`
            # in the sync has to be able to replace them.
            sudo chown -R "$(id -u):$(id -g)" .
            SYNC_OUT=$(make refresh-sync)
            # Print only the parsed fields — never a command's whole stdout (rule 3d),
            # and never into $GITHUB_OUTPUT (issue #346).
            printf '%s\n' "$SYNC_OUT" \
              | sed -n 's/^\(mode\|base\|base_sha\|head_before\|head\|behind_base\|kept\|raw_snapshots\|raw_floor\|sync\)=.*/&/p'
            RAW_FLOOR=$(printf '%s\n' "$SYNC_OUT" | sed -n 's/^raw_floor=//p')
            # `SINCE` = the oldest snapshot THIS run gathered: the base's own
            # `generated_utc` may be newer than it (another refresh merged while these
            # legs searched) and the derived boundary would then skip exactly this
            # refresh's data (issue #175). Empty is dropped by the target (rule 3d).
            make merge SINCE="$RAW_FLOOR"
            # The checks above ran on the tree as it was BEFORE this sync, and the PR
            # must carry a tree the same checks have seen: re-run the soft QA report
            # on the re-derived data (a finding is reported, a target that could not
            # run still fails — issue #147).
            make qa-report
            sudo chown -R "$(id -u):$(id -g)" .
            git checkout -b "$BRANCH"
            git add README.md data/models.json data/snapshots data/raw data/gap_baseline.json data/measurements.json data/posts.json tests/fixtures/github_meta.json tests/fixtures/hermes_releases_latest.json
            # The re-derivation can legitimately produce nothing (the base already
            # carries this data). Then there is no PR to open — say so, don't fail.
            if git diff --cached --quiet; then
              echo "No data changes after the base sync — no PR opened."
              echo "pr_opened=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore: Hermes refresh of trending LLM data (3 separate searches)

            Auto-generated by the refresh-bot pipeline. Three per-backend searches
            (NVIDIA, Metal, CPU) each wrote its own timestamped raw
            snapshot in data/raw/. Merged into data/models.json, README
            regenerated. No existing model removed. Auto-merged by
            qa-validate once green. Ref: #1"
            # Never publish a branch the base has already left (issue #177): the sync
            # above closed the long window, this closes the one between the merge and
            # the push. A run that finds master moved again fails here, loudly, instead
            # of opening a PR GitHub reports as conflicting once its checks are green.
            make refresh-require-tip
            git push origin "$BRANCH"
            # The run's WINDOW as the body's first block (issue #199): the REAL job
            # timestamps, read from the API by `make refresh-run-block` (never a wall clock
            # at PR-open time), with the marker line from the shared helper (#197). An
            # in-flight refresh is then readable from the PR a human actually opens, and a
            # reviewer can tell WHICH run opened it and when each leg started.
            # Written to $RUNNER_TEMP, so no scratch file lands in the checkout.
            # The body is COMPOSED by a target (issue #542), never built here: the window block
            # (#199) and the contract a reviewer relies on are one artifact, so the text can be
            # rendered and asserted by a test instead of living in a YAML block.
            PR_BODY="$RUNNER_TEMP/refresh-pr-body.md"
            make refresh-pr-body > "$PR_BODY"
            PR_URL=$(gh pr create --base master --head "$BRANCH" \
              --title "chore: Hermes refresh of trending LLM data" \
              --body-file "$PR_BODY" 2>/dev/null)
            PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$' | head -1 || echo "")
            echo "pr_opened=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
            echo "pr_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

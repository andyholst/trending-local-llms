name: refresh-bot

# BOT pipeline — scheduled data refresh. Fully container-agnostic: builds the
# self-contained Docker image (Python deps + Hermes CLI, cached) and runs the
# four Hermes searches as SEPARATE PARALLEL jobs (each writes its own
# data/raw/<backend>-<UTC>.json), then a final job aggregates them (merge ->
# validate -> test) and opens a PR only when there is new data. Never
# auto-merges. The PR is validated by qa-validate.yml; if red, fix-bot.yml
# re-runs Hermes to correct it.
#
# Local equivalent:
#   make docker-build && NOUS_API_KEY=... FIRECRAWL_API_KEY=... make refresh

on:
  schedule:
    # Daily 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Build the image once, cache it, and share it with the search jobs via the
  # docker layer cache. Each search job rebuilds from cache (fast).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            docker-${{ runner.os }}-
      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: trending-local-llms:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

  # Four independent searches, run in parallel. Each writes its own raw
  # snapshot to data/raw/<backend>-<UTC>.json and uploads it as an artifact.
  search:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [nvidia, metal, cpu, general]
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - name: Owner-only trigger guard
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "Only the repository owner may trigger refresh-bot manually."
            exit 1
          fi
          echo "Owner confirmed: ${{ github.actor }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: trending-local-llms:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Hermes search (${{ matrix.backend }})
        run: |
          make search-${{ matrix.backend }}

      - name: Upload raw snapshot
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.backend }}
          path: data/raw/*.json
          if-no-files-found: error

  # Aggregate: download all four raw snapshots, merge into models.json + README,
  # validate + test, then open a PR if there is new data.
  aggregate:
    needs: search
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Build image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: trending-local-llms:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Download raw snapshots
        uses: actions/download-artifact@v4
        with:
          path: data/raw
          pattern: raw-*
          merge-multiple: true

      - name: Merge + validate + test (in container)
        run: |
          make merge
          make validate
          make validate-search
          make validate-mapped
          make test
          echo "QA passed: no models removed, fields+links present, backend tables sorted by t/s, JSON<->README sync, search contract, mapping, all models in README."

      - name: Commit + open PR if changed
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md data/models.json data/snapshots data/raw; then
            echo "No data changes — no PR opened."
            echo "pr_opened=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="ci/trending-refresh-$(date +%Y%m%d-%H%M)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add README.md data/models.json data/snapshots data/raw
            git commit -m "chore: Hermes refresh of trending LLM data (4 separate searches)

            Auto-generated by the refresh-bot pipeline. Four per-backend searches
            (NVIDIA, Metal, CPU, General) each wrote its own timestamped raw
            snapshot in data/raw/. Merged into data/models.json, README
            regenerated. No existing model removed. Manual review required -
            not auto-merged. Ref: #1"
            git push origin "$BRANCH"
            gh pr create --base master --head "$BRANCH" \
              --title "chore: Hermes refresh of trending LLM data" \
              --body "Hermes CLI refresh (deepseek-v4-flash-0731 via Nous). Four separate per-backend searches (NVIDIA, Metal, CPU, General), each writing its own timestamped raw snapshot. No existing model removed. Manual review required. Closes #1"
            echo "pr_opened=true" >> "$GITHUB_OUTPUT"
          fi

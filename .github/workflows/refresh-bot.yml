name: refresh-bot

# BOT pipeline — scheduled data refresh. Fully container-agnostic: builds the
# self-contained Docker image (Python deps + Hermes CLI) ONCE, pushes it to
# GHCR, and the four Hermes searches run as SEPARATE PARALLEL jobs that PULL
# the prebuilt image (each writes its own data/raw/<backend>-<UTC>.json), then
# a final job aggregates them (merge -> validate -> test) and opens a PR only
# when there is new data. Never auto-merges. The PR is validated by
# qa-validate.yml; if red, fix-bot.yml re-runs Hermes to correct it.
#
# Local equivalent:
#   make docker-build && NOUS_API_KEY=... FIRECRAWL_API_KEY=... make refresh

on:
  schedule:
    # Daily 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  # Build the image ONCE and push it to GHCR. The search + aggregate jobs PULL
  # this prebuilt image instead of rebuilding — so the Hermes install
  # (ADD install.sh + RUN) runs exactly once per run, not 6x.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      built: ${{ steps.decide.outputs.built }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Decide whether to rebuild: only when the image does NOT exist yet, or
      # when it is SUNDAY (weekly cadence — the Dockerfile bakes a real Hermes
      # update via `make update-hermes` on that rebuild). Any other day reuses
      # the existing GHCR image, so the Hermes install/update runs at most once
      # per week instead of on every run.
      - name: Decide whether to rebuild image
        id: decide
        run: |
          DOW=$(date +%u)
          if docker manifest inspect "${{ env.IMAGE }}" >/dev/null 2>&1; then
            EXISTS=1; else EXISTS=0; fi
          echo "DOW=$DOW exists=$EXISTS"
          if [ "$DOW" = "7" ] || [ "$EXISTS" = "0" ]; then
            echo "built=yes"
            echo "built=yes" >> "$GITHUB_OUTPUT"
          else
            echo "built=no"
            echo "built=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            docker-${{ runner.os }}-
      - name: Build + push image (only if missing or Sunday)
        if: steps.decide.outputs.built == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
      - name: Image already current — skip rebuild
        if: steps.decide.outputs.built != 'yes'
        run: |
          echo "GHCR image exists and today is not Sunday; reusing existing image."

  # Four independent searches, run in parallel. Each PULLS the prebuilt image
  # (no rebuild), writes its own raw snapshot, and uploads it as an artifact.
  search:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [nvidia, metal, cpu, general]
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - name: Owner-only trigger guard
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "Only the repository owner may trigger refresh-bot manually."
            exit 1
          fi
          echo "Owner confirmed: ${{ github.actor }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull prebuilt image
        run: |
          docker pull ${{ env.IMAGE }}
          docker tag ${{ env.IMAGE }} trending-local-llms:latest

      - name: Hermes search (${{ matrix.backend }})
        run: |
          make search-${{ matrix.backend }}

      - name: Upload raw snapshot
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.backend }}
          path: data/raw/*.json
          if-no-files-found: error

  # Aggregate: download all four raw snapshots, merge into models.json + README,
  # validate + test, then open a PR if there is new data.
  aggregate:
    needs: search
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull prebuilt image
        run: |
          docker pull ${{ env.IMAGE }}
          docker tag ${{ env.IMAGE }} trending-local-llms:latest

      - name: Download raw snapshots
        uses: actions/download-artifact@v4
        with:
          path: data/raw
          pattern: raw-*
          merge-multiple: true

      - name: Merge + validate + test (in container)
        run: |
          make merge
          # Self-correct raw snapshots FIRST (prune extra keys, fill last_seen)
          # so _validate sees contract-conforming data. Previously validate ran
          # before self_correct_raw (only in validate-search) and the aggregate
          # aborted on raw snapshots with extra fields / missing last_seen.
          make correct-raw
          # Validation is SOFT (like _refresh): a data-quality finding is
          # reported but does NOT abort — the merged data still lands as a PR,
          # qa-validate flags it, and fix-bot repairs it on the PR branch.
          make validate || echo "[aggregate] _validate reported issues (see above); opening PR for review"
          make validate-search || echo "[aggregate] _validate-search reported issues (see above)"
          make validate-mapped || echo "[aggregate] _validate-mapped reported issues (see above)"
          make test || echo "[aggregate] _test reported failures (see above)"
          echo "QA findings reported above; data landed for review."

      - name: Commit + open PR if changed
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md data/models.json data/snapshots data/raw; then
            echo "No data changes — no PR opened."
            echo "pr_opened=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="ci/trending-refresh-$(date +%Y%m%d-%H%M)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add README.md data/models.json data/snapshots data/raw
            git commit -m "chore: Hermes refresh of trending LLM data (4 separate searches)

            Auto-generated by the refresh-bot pipeline. Four per-backend searches
            (NVIDIA, Metal, CPU, General) each wrote its own timestamped raw
            snapshot in data/raw/. Merged into data/models.json, README
            regenerated. No existing model removed. Manual review required -
            not auto-merged. Ref: #1"
            git push origin "$BRANCH"
            gh pr create --base master --head "$BRANCH" \
              --title "chore: Hermes refresh of trending LLM data" \
              --body "Hermes CLI refresh (deepseek-v4-flash-0731 via Nous). Four separate per-backend searches (NVIDIA, Metal, CPU, General), each writing its own timestamped raw snapshot. No existing model removed. Manual review required. Closes #1"
            echo "pr_opened=true" >> "$GITHUB_OUTPUT"
          fi

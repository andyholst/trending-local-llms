name: refresh-bot

# BOT pipeline — scheduled data refresh. Fully container-agnostic: builds the
# self-contained Docker image (Python deps + Hermes CLI) ONCE, pushes it to
# GHCR, and the four Hermes searches run as SEPARATE PARALLEL jobs that PULL
# the prebuilt image (each writes its own data/raw/<backend>-<UTC>.json), then
# a final job aggregates them (merge -> validate -> test) and opens a PR only
# when there is new data. Never merges itself; the PR is validated by
# qa-validate.yml; if its deterministic `validate` job is red, qa-validate
# dispatches fix-bot.yml, which repairs the branch and re-triggers CI. Green
# -> qa-validate's auto-merge job squash-merges it and deletes the branch.
#
# The PR is created with the owner-scoped PAT (FIXBOT_DISPATCH_TOKEN), NOT the
# default GITHUB_TOKEN: a PR authored by github-actions[bot] holds every
# pull_request run for manual approval, and pushes/PRs made with GITHUB_TOKEN
# do not trigger workflows at all. With the PAT, qa-validate starts on its own.
#
# Local equivalent:
#   make docker-build && NOUS_API_KEY=... FIRECRAWL_API_KEY=... make refresh

on:
  schedule:
    # Daily 06:00 UTC, plus a backup slot at an odd time. GitHub delays (and
    # under load DROPS) scheduled runs, worst at the top of the hour: the
    # 06:00 run kept starting ~6 h late or not at all. 17:43 UTC is off the
    # :00 rush and far enough from 06:00 to cover a dropped morning run.
    # `concurrency` below queues the two if they ever overlap.
    - cron: "0 6 * * *"
    - cron: "43 17 * * *"
  workflow_dispatch:
    inputs:
      # Owner-only (the guard checks the actor): republish the base image even
      # when its Dockerfile hash tag already exists — for the case where a
      # merged Dockerfile change must reach the bots NOW instead of on Sunday.
      force_rebuild:
        description: "Rebuild + publish the base image even if it is current"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write

# One refresh at a time: a scheduled run and a manual run queue instead of
# racing to open competing PRs over the same generated files.
concurrency:
  group: refresh-bot
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest
  # The published tag that carries the Dockerfile hash the image was built from
  # (`dockerfile-<hash>`). A Dockerfile change is inert until the base is
  # rebuilt [#135], so the hash tag — not the Sunday cadence — decides it. The
  # same idea publishes the test image under `test-<hash>` [#141]; both tags come
  # from `scripts/ensure_image.py`, the definition consumers read too.
  IMAGE_REPO: ghcr.io/${{ github.repository }}
  TEST_IMAGE: ghcr.io/${{ github.repository }}-test:latest

jobs:
  # Gate EVERY job: a scheduled run passes; a manual dispatch (or a re-run)
  # passes only when both the actor and the triggering actor are the repo
  # owner or a collaborator with write/maintain/admin. Previously only the search job checked, and `aggregate`
  # (if: always()) still ran — with secrets and the owner PAT — on a refusal.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Owner / collaborator trigger guard
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            echo "Scheduled run - allowed."
            exit 0
          fi
          # Owner, or a collaborator with write/maintain/admin, for BOTH the
          # actor and the triggering actor (covers re-runs). Anything else -
          # including an API error - is refused.
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  # Build the image ONCE and push it to GHCR. The search + aggregate jobs PULL
  # this prebuilt image instead of rebuilding — so the Hermes install
  # (ADD install.sh + RUN) runs exactly once per run, not 6x.
  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      built: ${{ steps.decide.outputs.built }}
      test_built: ${{ steps.decide.outputs.test_built }}
      test_tag: ${{ steps.decide.outputs.test_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Decide whether to rebuild: when the image does NOT exist yet, when the
      # tag naming its inputs (`scripts/ensure_image.py`) is not published, when
      # it is SUNDAY (weekly cadence — the Dockerfile bakes a real Hermes
      # update via `make update-hermes` on that rebuild), or when a dispatch
      # forces it. Any other day reuses
      # the existing GHCR image, so the Hermes install/update runs at most once
      # per week instead of on every run.
      - name: Decide whether to rebuild the images
        id: decide
        run: |
          DOW=$(date +%u)
          # ONE definition of "built from this revision": the tags come from
          # `scripts/ensure_image.py`, the same script `make image-ensure` reads,
          # so publisher and consumer can never disagree. The Dockerfile(s)
          # define the base image's contents — including the pinned plugins — and
          # "that hash is not published" is a rebuild reason by itself: without
          # it a merged Dockerfile change stays inert until the next Sunday and
          # the bots keep running the old runtime [#135]. The test image carries
          # its own tag (Dockerfile.test + requirements-test.txt + the base hash)
          # so it is rebuilt and published by the SAME rules [#141].
          eval "$(python3 scripts/ensure_image.py tags)"
          FORCE="${{ inputs.force_rebuild }}"
          if docker manifest inspect "${{ env.IMAGE }}" >/dev/null 2>&1; then
            EXISTS=1; else EXISTS=0; fi
          if docker manifest inspect "$BASE_TAG" >/dev/null 2>&1; then
            HASHED=1; else HASHED=0; fi
          if docker manifest inspect "$TEST_TAG" >/dev/null 2>&1; then
            TEST_HASHED=1; else TEST_HASHED=0; fi
          echo "DOW=$DOW exists=$EXISTS base=$BASE_TAG base_published=$HASHED test=$TEST_TAG test_published=$TEST_HASHED force=$FORCE"
          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "test_tag=$TEST_TAG" >> "$GITHUB_OUTPUT"
          if [ "$DOW" = "7" ] || [ "$EXISTS" = "0" ] || [ "$HASHED" = "0" ] || [ "$FORCE" = "true" ]; then
            echo "built=yes"
            echo "built=yes" >> "$GITHUB_OUTPUT"
          else
            echo "built=no"
            echo "built=no" >> "$GITHUB_OUTPUT"
          fi
          if [ "$DOW" = "7" ] || [ "$TEST_HASHED" = "0" ] || [ "$FORCE" = "true" ]; then
            echo "test_built=yes"
            echo "test_built=yes" >> "$GITHUB_OUTPUT"
          else
            echo "test_built=no"
            echo "test_built=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile', 'requirements.txt') }}
          restore-keys: |
            docker-${{ runner.os }}-
      - name: Build + push image (missing, Dockerfile changed, Sunday, or forced)
        if: steps.decide.outputs.built == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `latest` for consumers + the hash tag that records WHICH Dockerfile
          # this image was built from, so the next run can tell whether the
          # merged Dockerfile is already live. The tag comes from
          # `scripts/ensure_image.py` (the consumer's own definition).
          tags: |
            ${{ env.IMAGE }}
            ${{ steps.decide.outputs.base_tag }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
      - name: Image already current — skip rebuild
        if: steps.decide.outputs.built != 'yes'
        run: |
          echo "GHCR image exists and is built from this Dockerfile (hash tag published); reusing it."

  # The TEST image is an image of its own: it layers the current
  # requirements-test.txt on the base and was previously built inline by every
  # job that needed it (four implementations of one stage, issue #141). It is
  # published under a tag naming THIS revision's inputs, on the same rules as
  # the base (missing tag / Sunday / forced), so runs pull it instead of
  # rebuilding it.
  test-image:
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Docker layers (test image)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-test
          key: docker-test-${{ runner.os }}-${{ hashFiles('Dockerfile.test', 'requirements-test.txt') }}
          restore-keys: |
            docker-test-${{ runner.os }}-
      # Built FROM the published base: the `build` job above has just published
      # this revision's base (or reused it when the hash tag already matched).
      - name: Build + push the test image (missing, changed, Sunday, or forced)
        if: needs.build.outputs.test_built == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          push: true
          build-args: BASE_IMAGE=${{ env.IMAGE }}
          tags: |
            ${{ env.TEST_IMAGE }}
            ${{ needs.build.outputs.test_tag }}
          cache-from: type=local,src=/tmp/.buildx-cache-test
          cache-to: type=local,dest=/tmp/.buildx-cache-test,mode=max
      - name: Test image already current — skip rebuild
        if: needs.build.outputs.test_built != 'yes'
        run: |
          echo "The published test image is built from this revision's inputs; reusing it."

  # Four independent searches (nvidia, metal, cpu, amd), run in parallel. Each PULLS the prebuilt image
  # (no rebuild), writes its own raw snapshot, and uploads it as an artifact.
  search:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [nvidia, metal, cpu, amd]
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      # The nerve plugin's Jev provider credential (issue #120): forwarded by NAME
      # only, as `-e TYPESAFE_API_KEY` in the Makefile run wrappers.
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare the base image (published for this revision, else build)
        run: make image-ensure-base

      - name: Reachability smoke (${{ matrix.backend }}) — HTTP 200 within 3s
        run: |
          make _search-smoke BACKEND=${{ matrix.backend }}

      # One real Hermes call through the search alias before the 20-minute
      # search: a dead key / broken alias / provider mis-route fails here in
      # seconds instead of after the search burned its budget.
      # The endpoint silently clamps max_tokens to the model's real cap; a
      # mismatch (or a model that can't switch reasoning off) burns the budget.
      - name: Model caps (model served, max_tokens fits, accepts reasoning)
        run: make model-caps

      - name: Hermes routing smoke
        run: make hermes-smoke

      - name: Hermes search (${{ matrix.backend }})
        run: |
          make search-${{ matrix.backend }}

      # Report NOW (not first at PR CI) any engine this leg found that isn't
      # registered, and what ingest will decide: registered (real engine with
      # a verified GitHub repo) / not-engine (harness, app, benchmark) /
      # unknown / no-repo. Report only — never fails the leg.
      - name: Engine check (report only)
        run: make engine-check

      - name: Upload raw snapshot
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.backend }}
          path: data/raw/*.json
          # A search that finds no new data (or can't reach the source) is
          # tolerated, not a hard failure — the refresh is resilient by design
          # (AGENTS.md: preserve last-known data, never blank the store).
          if-no-files-found: warn

  # Aggregate: download all four raw snapshots, merge into models.json + README,
  # validate + test, then open a PR if there is new data.
  aggregate:
    needs: [guard, build, search]
    # Run even if one or more search jobs failed (a backend that found no data
    # or couldn't reach the source must not abort the whole refresh). Merge
    # whatever searches DID produce data and still open a PR.
    # Tolerate a failed search leg (merge what the other legs found), but
    # NEVER run on a refused guard or a failed build.
    if: always() && needs.guard.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # The nerve plugin's Jev provider credential (issue #120): forwarded by NAME
      # only, as `-e TYPESAFE_API_KEY` in the Makefile run wrappers.
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      # PAT checkout: the branch push below is then made as the owner, so the
      # PR's qa-validate run starts without an approval click.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}

      # BOTH images: this job's steps run test-image targets (`make data-gaps`,
      # `make test`), and preparing only the base left `data-gaps` dying with
      # "Unable to find image 'trending-local-llms-test:latest'" (issue #145).
      - name: Prepare the runner images (published for this revision, else build)
        run: make image-ensure

      - name: Download raw snapshots
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: data/raw
          pattern: raw-*
          merge-multiple: true

      - name: Engine check across all legs (report only)
        run: make engine-check

      - name: Merge + validate + test (in container)
        run: |
          # Run the direct Firecrawl->lightbrd search + merge: gathers engagement
          # the Hermes prompts also capture, and exercises the --fetch integration.
          make merge-fetch
          # Self-correct raw snapshots FIRST (prune extra keys, fill last_seen)
          # so _validate sees contract-conforming data. Previously validate ran
          # before self_correct_raw (only in validate-search) and the aggregate
          # aborted on raw snapshots with extra fields / missing last_seen.
          make correct-raw
          # Validation is SOFT for FINDINGS (like _refresh): a data-quality
          # finding is reported but does NOT abort — the merged data still lands
          # as a PR, qa-validate flags it, and fix-bot repairs it on the PR branch.
          # A target that could not run at all (no image, no command: docker
          # 125/127) is NOT a finding and fails the job — the previous
          # `|| echo` guards reported that state as a green run (issue #147).
          make qa-report

      - name: Data-gap analysis (report only)
        run: make data-gaps

      - name: File a data-gap issue when the gap set changed (issue #115)
        # Report-only: a failure here never fails the data PR.
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
        run: make data-gap-issue
        # The baseline (data/gap_baseline.json) is written by `make data-gap-issue`
        # when it files, so a day with the same gap set files nothing.

      - name: Commit + open PR if changed
        id: pr
        env:
          # Owner PAT — see the header: a GITHUB_TOKEN-authored PR is held for
          # approval and never auto-starts qa-validate.
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
        run: |
          if git diff --quiet -- README.md data/models.json data/snapshots data/raw; then
            echo "No data changes — no PR opened."
            echo "pr_opened=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH="ci/trending-refresh-$(date +%Y%m%d-%H%M)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            sudo chown -R "$(id -u):$(id -g)" .
            git add README.md data/models.json data/snapshots data/raw
            git commit -m "chore: Hermes refresh of trending LLM data (3 separate searches)

            Auto-generated by the refresh-bot pipeline. Three per-backend searches
            (NVIDIA, Metal, CPU) each wrote its own timestamped raw
            snapshot in data/raw/. Merged into data/models.json, README
            regenerated. No existing model removed. Auto-merged by
            qa-validate once green. Ref: #1"
            git push origin "$BRANCH"
            PR_URL=$(gh pr create --base master --head "$BRANCH" \
              --title "chore: Hermes refresh of trending LLM data" \
              --body "Hermes CLI refresh (deepseek-v4.1-flash via Nous). Three separate per-backend searches (NVIDIA, Metal, CPU), each writing its own timestamped raw snapshot. No existing model removed. Auto-merged when qa-validate is green; red stays open for review. Closes #1" 2>/dev/null)
            PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$' | head -1 || echo "")
            echo "pr_opened=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
            echo "pr_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

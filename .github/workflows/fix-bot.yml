name: fix-bot

# FIX-BOT pipeline — triggered when the PR CI (qa-validate) is RED. Fully
# container-agnostic: builds the self-contained Docker image (Python deps +
# Hermes CLI, cached) and runs `make fix` (Hermes) + validate + test inside it.
# Pushes the correction to the same PR branch so CI re-runs green. Up to 3
# rounds, then leaves the PR for manual review. Never auto-merges.
#
# Local equivalent:
#   make docker-build && NOUS_API_KEY=... FIRECRAWL_API_KEY=... make fix

on:
  workflow_run:
    workflows: ["qa-validate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: "PR head branch to fix (overrides the failed run's branch)"
        required: false
        default: ""
      pr_number:
        description: "PR number to fix (direct lookup, bypasses branch search)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write  # lets the fix-bot dispatch workflows (self/refresh) autonomously

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Resolve PR from failed run
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual dispatch can name the PR directly (pr_number) or its branch.
          # pr_number is the robust path: the ephemeral GITHUB_TOKEN in a
          # workflow_run/manual-dispatch context can fail to LIST a bot-authored
          # PR by head branch, but gh pr view by NUMBER resolves reliably.
          if [ -n "${{ inputs.pr_number }}" ]; then
            PR_NUM="${{ inputs.pr_number }}"
            HEAD_BRANCH=$(gh pr view "$PR_NUM" --json headRefName -q .headRefName 2>/dev/null || echo "")
            echo "Manual dispatch: fixing PR #$PR_NUM on branch $HEAD_BRANCH"
          else
            if [ -n "${{ inputs.branch }}" ]; then
              HEAD_BRANCH="${{ inputs.branch }}"
            else
              HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            fi
            echo "Resolving PR for head branch: $HEAD_BRANCH"
            # Try by number-of-list first; fall back to a broader API search.
            PR_NUM=$(gh pr list --head "$HEAD_BRANCH" --json number -q '.[0].number' 2>/dev/null || echo "")
            if [ -z "$PR_NUM" ]; then
              PR_NUM=$(gh api "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:$HEAD_BRANCH" -q '.[0].number // ""' 2>/dev/null || echo "")
            fi
            echo "PR #$PR_NUM for branch $HEAD_BRANCH"
          fi
          if [ -z "$PR_NUM" ] || [ -z "$HEAD_BRANCH" ]; then
            echo "Could not resolve an open PR — nothing to fix."
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"
            echo "branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR branch
        if: steps.pr.outputs.has_pr == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}

      - name: Set up Docker Buildx
        if: steps.pr.outputs.has_pr == 'true'
        uses: docker/setup-buildx-action@v3

      # Pull the prebuilt base image from GHCR (pushed by refresh-bot) instead
      # of rebuilding it — the Hermes install + Python deps are baked in and
      # only rebuilt on Sunday. The image is public, so no login is needed.
      - name: Pull base image from GHCR
        if: steps.pr.outputs.has_pr == 'true'
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest
          docker tag ghcr.io/${{ github.repository }}:latest trending-local-llms:latest

      # Build the TEST image (base + current test requirements) so the
      # validate-search / validate-mapped / test rounds run with the libs the
      # repo pins (markdown-it-py, tabulate), not the stale non-Sunday base.
      - name: Build test image (base + current test requirements)
        if: steps.pr.outputs.has_pr == 'true'
        run: |
          docker build -f Dockerfile.test -t trending-local-llms-test:latest .

      - name: Hermes fix — correct the CI failure (up to 5 rounds, in container)
        if: steps.pr.outputs.has_pr == 'true'
        run: |
          for round in 1 2 3 4 5; do
            echo "--- fix round $round ---"
            # Each public make target runs inside the container:
            # fix = self-correct raw snapshots -> Hermes fixes logic -> merge;
            # then validate the mapped result (search contract + mapping + data
            # + schema) and run the tests.
            make fix
            make validate-search
            make validate-mapped
            make test
            git add README.md data/models.json data/snapshots data/raw
            git commit -m "fix: address CI validation failure (round $round)" || echo "no changes to commit"
            git push origin "${{ steps.pr.outputs.branch }}" || echo "push failed (may be nothing to push)"
            # Give the re-triggered qa-validate a moment; loop continues if still red
            sleep 30
          done
          echo "Exhausted fix rounds; leaving PR for manual review."

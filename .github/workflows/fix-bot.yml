name: fix-bot

# FIX-BOT pipeline — repairs a RED refresh PR, then leaves it for human review.
#
# Triggered ONLY by workflow_dispatch from qa-validate's `dispatch-fixbot` job,
# which fires when the deterministic `validate` job fails on a refresh PR
# (ci/trending-refresh-*). There is deliberately NO `workflow_run` trigger:
# it would double-fire alongside the explicit dispatch, and for bot-authored
# PRs it was silently suppressed. qa-validate passes pr_number + branch.
#
# Flow (scripts/fix_loop.sh — unit-tested in tests/test_fix_loop.py):
#   check (validate, validate-search, validate-mapped, test) -> green? stop
#   red  -> write qa-report.txt -> `make fix` (Hermes reads the report) -> re-check
#   at most FIX_ROUNDS Hermes attempts.
# Push ONLY when the loop ends green. Still red -> comment the report on the PR,
# push nothing, leave for manual review. Never touches master; never merges
# (qa-validate's auto-merge job merges the PR once the re-run is green).
#
# The checkout + push use the owner-scoped PAT (FIXBOT_DISPATCH_TOKEN) so the
# push re-triggers qa-validate on the PR — a push made with the default
# GITHUB_TOKEN does NOT start new workflow runs, so CI would never re-check.
#
# Local equivalent (repo checked out on the PR branch):
#   make docker-test-build && NOUS_API_KEY=... FIRECRAWL_API_KEY=... scripts/fix_loop.sh

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to fix"
        required: false
        default: ""
      branch:
        description: "PR head branch (used when pr_number is empty)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  # The window announcement uses the DEFAULT `github.token`, so it needs the
  # Issues scope: the owner PAT is scoped to Actions/Contents/Pull-requests and
  # cannot comment (measured: `Resource not accessible by personal access token
  # (addComment)` on #124). issue #198.
  issues: write

# One fix-bot at a time per PR; a second dispatch queues instead of racing.
concurrency:
  group: fix-bot-${{ inputs.pr_number || inputs.branch }}
  cancel-in-progress: false

jobs:
  # The guard is its OWN job and runs FIRST — before the run holds a single
  # secret (rule 6j). A job-level `env:` holding `secrets.*` belongs to the JOB,
  # not to a step: the runner materialises it when the job starts, so a guard
  # that lives as a STEP of the secret-carrying job is not "before any secret",
  # however early that step sits (measured, issue #259: the fix job declared all
  # four secrets at job level above its guard step, and the test that was
  # supposed to enforce the rule only looked at STEPS).
  #
  # This job declares NO `secrets.` at all: the default `github.token` it uses
  # to ask the collaborator-permission API is injected by GitHub for the run and
  # is not a repository secret.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only the owner, the bot itself, or a collaborator with write access may
      # run fix-bot (it spends the Nous key and pushes with the owner PAT).
      # qa-validate dispatches it with the owner PAT, so its actor IS the owner.
      - name: Owner / collaborator trigger guard
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            echo "Scheduled run - allowed."
            exit 0
          fi
          # Owner, the bot itself (github-actions[bot], a bot-to-bot dispatch), or
          # a collaborator with write/maintain/admin, for BOTH the actor and the
          # triggering actor (covers re-runs). Anything else - including an API
          # error - is refused.
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            if [ "$u" = "github-actions[bot]" ]; then echo "The bot itself ($u) - allowed."; continue; fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner, the bot, or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  # The work: `needs: [guard]`, so a refused caller means this job never starts
  # and its secrets are never materialised.
  fix:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NOUS_API_KEY: ${{ secrets.NOUS_PORTAL_API_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # The nerve plugin's Jev provider credential (issue #120): forwarded by NAME
      # only, as `-e TYPESAFE_API_KEY` in the Makefile run wrappers.
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      FIX_ROUNDS: "3"
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          IN_PR: ${{ inputs.pr_number }}
          IN_BRANCH: ${{ inputs.branch }}
        run: |
          PR_NUM="$IN_PR"
          HEAD_BRANCH=""
          if [ -n "$PR_NUM" ]; then
            HEAD_BRANCH=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq 'select(.state=="open") | .head.ref' 2>/dev/null || echo "")
          elif [ -n "$IN_BRANCH" ]; then
            PR_NUM=$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$IN_BRANCH" --jq '.[0].number // ""' 2>/dev/null || echo "")
            [ -n "$PR_NUM" ] && HEAD_BRANCH="$IN_BRANCH"
          fi
          echo "PR #$PR_NUM -> branch '$HEAD_BRANCH'"
          case "$HEAD_BRANCH" in
            ""|master|main)
              echo "No open PR on a feature branch resolved — nothing to fix (never touches master)."
              echo "has_pr=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "has_pr=true" >> "$GITHUB_OUTPUT"
          echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"

      # Announce the window on the PR BEFORE anything reads the branch (issue #198).
      # The loop reads the branch and then pushes to it, so a reader in between - a
      # human, the reviewer, the next qa-validate run - saw a state that was about to
      # change with nothing on the PR saying a repair was in flight. The timestamp is
      # what makes it readable: "is fix-bot working on this PR right now?" was
      # answerable only from the Actions API, which the PR page cannot show.
      # Body arrives on STDIN (`--body-file -`), so no scratch file is written that a
      # later `git add -A` in the push step could ever commit.
      - name: Announce the window on the PR
        if: steps.pr.outputs.has_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ steps.pr.outputs.pr_num }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n' \
            "<!-- fix-bot-start: $(date -u +%Y-%m-%dT%H:%M:%SZ) run=${GITHUB_RUN_ID} -->" \
            "fix-bot is repairing this PR **now**: it reads the branch, runs the check → fix → re-check loop (up to ${FIX_ROUNDS} Hermes round(s)), and pushes only when the loop ends green. It never merges — qa-validate's auto-merge does, once this PR is green again." \
            "" \
            "Branch: \`${BRANCH}\` · Run: ${RUN_URL}" \
          | gh pr comment "$PR_NUM" --body-file -

      - name: Checkout PR branch (PAT, so the push re-triggers qa-validate)
        if: steps.pr.outputs.has_pr == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          token: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}

      # Pull the prebuilt base (never rebuild it here) + build the TEST image
      # (base + current requirements-test.txt).
      # ONE path for both images: pull the published base/test image when they
      # were built from this revision, else build them here (issue #141).
      - name: Prepare runner images (published for this revision, else build)
        if: steps.pr.outputs.has_pr == 'true'
        run: make image-ensure

      # Fail in seconds, not after a 20-minute fix: one real Hermes call through
      # the exact alias `make fix` uses, with every key the container gets.
      - name: Hermes routing smoke
        if: steps.pr.outputs.has_pr == 'true'
        run: make hermes-smoke

      - name: Fix loop (check -> hermes fix with report -> re-check)
        id: loop
        if: steps.pr.outputs.has_pr == 'true'
        run: |
          set +e
          scripts/fix_loop.sh
          rc=$?
          if [ "$rc" = "0" ]; then echo "green=true" >> "$GITHUB_OUTPUT"; else echo "green=false" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Upload the QA report (what the loop saw)
        if: always() && steps.pr.outputs.has_pr == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa-report.txt
          if-no-files-found: ignore

      - name: Commit + push the fix (only when green)
        id: push
        if: steps.pr.outputs.has_pr == 'true' && steps.loop.outputs.green == 'true'
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          # The repo's own agent identity (issue #323, guard scripts/check_commit_authorship.py):
          # the only identities here are Andy Holst and Asimov Agent.
          git config user.name "Asimov Agent"
          git config user.email "support@docondee.com"
          # The container writes files as root; make them committable.
          sudo chown -R "$(id -u):$(id -g)" .
          # qa-report.txt / comment.md are in .gitignore, so a plain `add -A`
          # skips them. Never name an ignored path in the pathspec (not even as
          # ':!qa-report.txt'): git then exits 1 under bash -e and the green fix
          # is never pushed — that is how every fix-bot push was lost.
          git add -A
          git reset -q -- qa-report.txt comment.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Checks green with no changes (the CI failure was transient). Nothing to push."
            echo "pushed=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "fix-bot: repair CI validation failures on $BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "pushed=yes" >> "$GITHUB_OUTPUT"

      - name: Report result on the PR
        if: always() && steps.pr.outputs.has_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.FIXBOT_DISPATCH_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_num }}
          GREEN: ${{ steps.loop.outputs.green }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            # Close the window this run opened (#198): `if: always()`, so a loop that
            # died mid-way still ends with a timestamp and the PR never shows a repair
            # as permanently in flight.
            echo "<!-- fix-bot-end: $(date -u +%Y-%m-%dT%H:%M:%SZ) run=${GITHUB_RUN_ID} -->"
            if [ "$GREEN" = "true" ] && [ "$PUSH_OUTCOME" != "success" ]; then
              echo "fix-bot: local checks went **green**, but committing/pushing the fix **failed** — nothing reached the PR. See the run log; manual review needed."
            elif [ "$GREEN" = "true" ] && [ "$PUSHED" = "yes" ]; then
              echo "fix-bot: local checks are **green** after the repair loop; the fix was pushed and qa-validate re-runs; it auto-merges if green."
            elif [ "$GREEN" = "true" ]; then
              echo "fix-bot: checks are **green** with no changes (the CI failure was transient); nothing pushed. Re-run qa-validate; it auto-merges if green."
            else
              echo "fix-bot: still **red** after up to $FIX_ROUNDS Hermes fix round(s) (or the run failed before the loop). Nothing pushed — manual review needed."
              echo
              echo '```'
              grep -E "FAIL|FAILED|Error|Traceback" qa-report.txt 2>/dev/null | grep -v "FAILED 0" | head -40
              echo '```'
            fi
            echo
            echo "Run: $RUN_URL"
          } > comment.md
          gh pr comment "$PR_NUM" --body-file comment.md

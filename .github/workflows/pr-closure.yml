name: pr-closure

# Issue #290 — THE CLOSURE CHECK RUNS ON THE ARTIFACT IT READS.
#
# `make pr-closure`'s entire input is the PR BODY (rule 6e: a merged PR must close the issue
# its branch implements, and GitHub binds a closing keyword to ONE reference). The body is
# the one part of a PR that changes WITHOUT a new commit — writing `closes #7` into the
# description, or fixing `Closes #271 and #276` into two lines, is a body edit and nothing
# else. qa-validate triggers on `pull_request` with GitHub's DEFAULT types (opened,
# synchronize, reopened), so an edit was never re-checked: the PR kept the verdict its last
# commit had earned, and a body that BROKE its closure kept a green check until someone
# pushed an unrelated commit.
#
# Why its own tiny pipeline instead of adding `edited` to qa-validate: that would re-run
# `validate` (image builds, the unit suite), the 30-minute network-bound `live-smoke` and a
# real Firecrawl spend every time a sentence in a PR description changes. This workflow is
# two jobs and seconds long, and it runs in addition to qa-validate's own closure gate.
#
# Local equivalent:  make pr-closure PR_EVENT=<event json>   (or BRANCH=<branch> BODY_FILE=<body>)
#
# Read-only: it never pushes, never comments, never merges. A red run here means the PR's
# body does not close what the branch implements — the fix is an edit, not a commit.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - "**"
      - "!LICENSE"

permissions:
  contents: read

jobs:
  # Rule 6j: the guard is the FIRST job of every bot pipeline, before any secret is read.
  # `pull_request` is a repository event — GitHub starts it for the repository itself, so
  # there is no caller to admit (the same clause qa-validate's guard carries).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Owner / collaborator trigger guard
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT" in
            pull_request|push)
              echo "$EVENT is a repository event, not a dispatch - allowed."
              exit 0 ;;
          esac
          # Owner, the bot itself (github-actions[bot], a bot-to-bot dispatch), or a
          # collaborator with write/maintain/admin, for BOTH the actor and the triggering
          # actor (covers re-runs). Anything else - including an API error - is refused.
          for u in "$ACTOR" "$TRIGGER"; do
            if [ "$u" = "$OWNER" ]; then continue; fi
            if [ "$u" = "github-actions[bot]" ]; then echo "The bot itself ($u) - allowed."; continue; fi
            perm=$(gh api "repos/$REPO/collaborators/$u/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in
              admin|maintain|write) echo "Collaborator $u has $perm - allowed." ;;
              *) echo "Refused: $u is not the owner, the bot, or a collaborator with write access (permission: ${perm:-none})."; exit 1 ;;
            esac
          done
          echo "Allowed: actor=$ACTOR triggering_actor=$TRIGGER"

  closure:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The check reads the webhook payload by PATH ($GITHUB_EVENT_PATH, the Makefile's own
      # PR_EVENT default) — the body is not interpolated into this block, and `edited` events
      # carry the NEW body, so the verdict always describes the text on screen now.
      - name: The PR closes the issue its branch implements (rule 6e)
        run: make pr-closure

# Generated by `make agent-profile-model-render` from agents/model_chain.json (issue #1203).
# DO NOT HAND-EDIT: `make agent-model-chain-check` compares this file byte-for-byte with what
# the chain renders, and the chain's ORDER is the contract — the free primary first, the free
# fallbacks in list order, the credential-less local tier (issue #1192), then the pinned paid
# model LAST as the last resort.
# The provider is the built-in `nous` provider (the Nous Portal session); a `nous` step carries
# ONLY `provider: nous` — adding `base_url`/`key_env` re-routes it to `custom` and 401s
# (measured, issue #1203). A credential is a NAME only (AGENTS.md rule 3e): `key_env`, never a
# value; no key's VALUE appears in this file or in any image layer.

model:
  provider: nous
  default: tencent/hy4-flash:free
  context_length: 1048576

# The chain, in the order it is used: primary, then each fallback, then the last resort.
# A lane selects a step with `hermes -m <alias>`; `key_env` names the variable the
# container receives, never its value (AGENTS.md rule 3e).
model_aliases:
  free-hy4:
    model: tencent/hy4-flash:free
    provider: nous
    context_window: 1048576
  free-solar:
    model: upstage/solar-mini4:free
    provider: nous
    context_window: 524288
  free-step:
    model: stepfun/step-3.7-flash:free
    provider: nous
    context_window: 256000
  local-strata:
    model: qwen3.8-flash-next-iq3_xxs
    provider: strata
    base_url: http://127.0.0.1:8080/v1
    context_window: 131072
  nous-deepseek:
    model: deepseek/deepseek-v4-flash-0731
    provider: nous
    context_window: 1048576

# Automatic runtime fallback in chain order (hermes_cli/fallback_config.py reads
# provider/model/base_url/key_env per entry): every free fallback, then the
# credential-less local tier, then the paid pin. The primary is model.default above.
fallback_providers:
  - provider: nous
    model: upstage/solar-mini4:free
  - provider: nous
    model: stepfun/step-3.7-flash:free
  - provider: strata
    model: qwen3.8-flash-next-iq3_xxs
    base_url: http://127.0.0.1:8080/v1
  - provider: nous
    model: deepseek/deepseek-v4-flash-0731
# Auxiliary task routing (issue #1798): the strata-pinned judge names the
# model the local server actually serves, with a Nous fallback chain so a
# dead local route falls through instead of pausing the goal after five failures.
auxiliary:
  goal_judge:
    provider: strata
    model: qwen3.8-flash-next-iq3_xxs
    base_url: http://127.0.0.1:8080/v1
    fallback_chain:
      - provider: nous
        model: upstage/solar-mini4:free
      - provider: nous
        model: stepfun/step-3.7-flash:free
      - provider: nous
        model: deepseek/deepseek-v4-flash-0731

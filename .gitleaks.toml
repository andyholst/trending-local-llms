# gitleaks configuration — the secret scan that runs before a push and in CI
# (issue #122; AGENTS.md rule 3d).
#
# `make secret-scan` (working tree, incl. staged files) and
# `make secret-scan-history` (full history) both use THIS file, so a rule added
# here applies everywhere. The default ruleset (150+ detectors: AWS, GitHub
# tokens, Slack webhooks, private keys, generic high-entropy) stays ON — this
# file only narrows the known false positives, each with the reason it is safe.

[extend]
useDefault = true

# 1. The gap-analysis baseline is a MACHINE-GENERATED signature file: one string
#    per gap, e.g. "missing:context_tokens:cyber-frost-3.8-mlx". The generic
#    API-key entropy heuristic matches those identifier chains (measured: 4
#    findings, all of them these lines). It can never carry an author-supplied
#    credential — it is written by scripts/data_gap_analysis.py from the model
#    ids in data/models.json.
[[allowlists]]
description = "generated gap-baseline signatures trip the generic entropy rule"
paths = ['''gap_baseline\.json$''']
ruleIDs = ["generic-api-key"]

# 2. Documentation and prompts show the SHAPE of a credential on purpose — a
#    redacted bearer header, a placeholder env var, an example token. These are
#    literal placeholders, never a value: the allowlist matches the placeholder
#    text only, so a REAL key pasted near one is still reported.
[[allowlists]]
description = "documented credential shapes and placeholders (never a real value)"
regexTarget = "match"
regexes = [
    # the Firecrawl header the search prompts print with the value elided
    '''Authorization: Bearer \*\*\*''',
    # "<NAME>=..." placeholders in docs/AGENTS.md/**/README
    '''(HF_TOKEN|NOUS_API_KEY|FIRECRAWL_API_KEY|JEV_KEY)=<[^>]+>''',
    # example values in documentation tables, e.g. `hf_…`, `sk-...`, `ghp_...`
    '''(hf_|sk-|ghp_|gho_|github_pat_|xox[baprs]-)\.\.\.''',
]

# 3. Vendored/large data the scanner should not walk (it is captured X post text
#    and generated tables — no credentials are authored there, and skipping keeps
#    the pre-push scan in the milliseconds it is supposed to take).
[[allowlists]]
description = "generated data + scraped snapshots: no author-supplied credentials"
paths = [
    '''^data/snapshots/''',
    '''^README\.md$''',
]
